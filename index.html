<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Greyhollow</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Spectral:ital,wght@0,400;0,600;1,400&family=Cutive+Mono&display=swap">
<style>
/* Layout: one reading column, a thin status strip on top, quest board as the hub. Dark-first: this is a game played at night. */
:root{
  --bg:#13161a; --paper:#1c2126; --fg:#dcd3c0; --muted:#9d917f; --line:#3a4149;
  --accent:#d3573f; --moss:#9db36f; --gold:#d4a84b; --violet:#b07fd6;
  --choice:#232930; --choice-h:#2d343c;
  --display:'IM Fell English',Georgia,'Times New Roman',serif;
  --body:'Spectral',Georgia,serif;
  --mono:'Cutive Mono','Courier New',monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#ece3cf; --paper:#f5eedd; --fg:#28211a; --muted:#6b5f50; --line:#c9bca0;
  --accent:#7d2419; --moss:#4a5a38; --gold:#8c6b2a; --violet:#5e3a7a;
  --choice:#fbf7ec; --choice-h:#f1e8d3; color-scheme:light } }
:root[data-theme="light"]{
  --bg:#ece3cf; --paper:#f5eedd; --fg:#28211a; --muted:#6b5f50; --line:#c9bca0;
  --accent:#7d2419; --moss:#4a5a38; --gold:#8c6b2a; --violet:#5e3a7a;
  --choice:#fbf7ec; --choice-h:#f1e8d3; color-scheme:light }

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:18px;line-height:1.55;padding-inline:16px;padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(40px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:640px;margin:0 auto;display:grid;gap:16px}
header{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:10px}
h1{font-family:var(--display);font-weight:400;font-size:1.9rem;margin:0;letter-spacing:.01em}
h1 em{color:var(--accent);font-style:italic}
.sub{font-family:var(--mono);font-size:.74rem;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.status{display:flex;flex-wrap:wrap;gap:6px 14px;font-family:var(--mono);font-size:.8rem;color:var(--muted);letter-spacing:.03em}
.status b{color:var(--fg);font-weight:400}
.status .eye b{color:var(--accent)}
.status .trust b{color:var(--moss)}
.status .coin b{color:var(--gold)}
.scene{background:var(--paper);border:1px solid var(--line);padding:20px 20px 16px;min-width:0}
.eyebrow{font-family:var(--mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
h2{font-family:var(--display);font-weight:400;font-size:1.55rem;margin:0 0 12px;text-wrap:balance;line-height:1.15}
.scene p{margin:0 0 .75em}
.scene .pip{margin:0 0 .9em;padding:10px 12px 10px 14px;border-left:3px solid var(--gold);background:color-mix(in srgb, var(--gold) 8%, transparent);font-style:italic}
.scene .pip .pl{display:block;font-family:var(--mono);font-style:normal;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin-bottom:3px}
.card{border:1px solid var(--line);background:color-mix(in srgb, var(--fg) 4%, transparent);padding:10px 14px;margin:0 0 14px;font-size:.93rem;display:grid;gap:4px}
.card span{display:block}
.card b{font-family:var(--mono);font-weight:400;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:8px}
.scene b.lore{font-family:var(--display);font-weight:400;color:var(--gold);font-size:1.1em}
.prompt{font-family:var(--mono);color:var(--muted);margin:14px 0 8px;font-size:.92rem}
.choices{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.choices button{width:100%;text-align:left;background:var(--choice);color:var(--fg);border:1px solid var(--line);padding:11px 13px;font:inherit;font-size:1.02rem;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;line-height:1.4}
.choices button:hover{background:var(--choice-h)}
.choices button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.choices button .who{display:block;font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--violet);margin-top:3px}
.choices button.w .who{color:var(--gold)}
.key{font-family:var(--mono);color:var(--accent)}
.result{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.result h3{font-family:var(--mono);font-weight:400;font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;margin:0 0 4px;color:var(--moss)}
.result ul{margin:0;padding-left:1.2em}
.result li{margin-bottom:4px}
.delta{font-family:var(--mono);font-size:.8rem;color:var(--muted);margin-top:8px}
.next{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap}
.btn{background:var(--fg);color:var(--bg);border:0;padding:10px 16px;font:inherit;font-size:.95rem;cursor:pointer}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.board{display:grid;gap:8px;list-style:none;margin:10px 0 0;padding:0}
.board button{width:100%;text-align:left;background:var(--choice);color:var(--fg);border:1px solid var(--line);padding:12px 14px;font:inherit;cursor:pointer;display:grid;gap:2px}
.board button:hover{background:var(--choice-h)}
.board button:disabled{opacity:.5;cursor:default}
.board .qn{font-family:var(--display);font-size:1.2rem}
.board .qs{font-family:var(--mono);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.board .done .qs{color:var(--moss)}
.pick{display:grid;gap:10px;margin-top:8px}
.pick button{text-align:left;background:var(--choice);color:var(--fg);border:1px solid var(--line);padding:14px;font:inherit;cursor:pointer}
.pick button:hover{background:var(--choice-h)}
.pick .nm{font-family:var(--display);font-size:1.4rem;display:block}
.pick .nm.w{color:var(--gold)}
.pick .nm.s{color:var(--violet)}
.pick .ds{font-size:.95rem;color:var(--muted)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.93rem;margin-top:8px}
th,td{text-align:left;vertical-align:top;padding:7px 9px;border-bottom:1px solid var(--line)}
th{font-family:var(--mono);font-weight:400;font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td.bad{color:var(--accent)}
td.good{color:var(--moss)}
.foot{font-size:.85rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.foot button{background:none;border:0;color:var(--muted);font:inherit;text-decoration:underline;cursor:pointer;padding:0}
@media (prefers-reduced-motion: no-preference){.scene{animation:fade .2s ease-out}}
@keyframes fade{from{opacity:.4}to{opacity:1}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Grey<em>hollow</em></h1>
    <div class="sub">A Witcher tale in five quests</div>
  </header>
  <div class="status" id="status"></div>
  <main id="main"></main>
  <div class="foot"><span>Keys 1-4 pick, Enter continues.</span><button id="world">The world in one page</button><button id="newgame">New game</button></div>
</div>

<script>
// ---------- state ----------
const SAVE_V = 3;   // bump to reset every player's save on next load
const fresh = () => ({ v:SAVE_V, role:null, trust:3, eye:0, coin:20, f:{}, done:{}, node:'world', chosen:null, log:[] });
let S = fresh();
const W = () => S.role === 'witcher';
const NAME = () => W() ? 'Garrick' : 'Ilvara';
const R = (w, s) => W() ? w : s;   // role text
function save(){ try{ localStorage.setItem('greyhollow', JSON.stringify(S)); }catch(e){} }
function load(){ try{ const j = localStorage.getItem('greyhollow'); if (j) { const p = JSON.parse(j); if (p && p.v === SAVE_V) S = Object.assign(fresh(), p); else localStorage.removeItem('greyhollow'); } }catch(e){} }
function clamp(){ S.trust = Math.max(0, Math.min(10, S.trust)); S.eye = Math.max(0, Math.min(10, S.eye)); S.coin = Math.max(0, S.coin); }

// ---------- nodes ----------
// node: { q, where, title, text: fn -> [strings], choices:[{t, who:'w'|'s', if:fn, do:fn, out:fn->[strings], next}], end:bool }
const N = {};

N.world = {
  where:'Before the story', title:'The world in one page',
  text: () => [
    'You do not need to know the Witcher books or games to play this. Here is everything that matters.',
    '<h>The war.</h> Two big powers are fighting over this part of the world. Nilfgaard is the empire from the south: black armor, disciplined, winning. Redania is the northern kingdom: paranoid, run by a king who burns anyone who can do magic. Greyhollow is a small river town stuck on the line between them. The river is the Pontar. The one stone bridge over it is the only reason anyone cares about the town.',
    '<h>The Eternal Fire.</h> Redania’s state church. Its witch hunters ride around in white cloaks arresting and burning sorceresses, mages, and anyone who looks like one. They answer to the city of Oxenfurt. In this game they are the people a sorceress is hiding from.',
    '<h>Witchers.</h> Men taken as boys and changed with mutations so they can hunt monsters for money. Cat eyes, two swords (steel for people, silver for monsters), and five simple spells called Signs: Aard (a shove), Igni (fire), Quen (a shield), Yrden (a trap), and Axii (a calming mind-trick). Most people fear them a little and hire them anyway. A medallion around their neck hums near magic.',
    '<h>Sorceresses.</h> Trained at a school called Aretuza. Powerful, long-lived, beautiful by choice (they fix their own faces with magic), and political. The Lodge was their secret club of the most powerful ones. A glamour is a spell that changes how you look.',
    '<h>Monsters you will meet.</h> A wraith is a ghost that formed from a bad death. A botchling or lubberkin is what a dead unnamed baby can become. A troll is big, slow, talks, and is not evil. A leshen is an ancient forest spirit shaped like a stag-headed tree; it protects its woods and demands a tithe. A godling is a tiny, friendly, chatty nature spirit. A hag is an old swamp witch who takes children. A pesta is a plague ghost.',
    '<h>Elves.</h> The Aen Seidhe are the elves who lived here before humans. Humans pushed them into the hills and now hunt the ones who fight back, who are called Scoia’tael. In Redania an elf caught near a road is usually hanged.',
    '<h>Words.</h> Ealdorman or alderman means village headman. A pellar is a village healer and spirit-talker. Crowns are money. Velen is the poor, swampy province the town sits in. Mahakam is the dwarf mountain country to the east where runaways go.',
    'That is it. The rest you will pick up as you go. Pip will explain things when it matters.'
  ],
  choices: [ { t:()=> S._return && S._return!=='world' ? 'Back to where I was.' : 'Got it. Who am I playing?', out:()=>[], next:()=>{ S.seenWorld = 1; const r = S._return; S._return = null; return (r && r!=='world' && N[r]) ? r : (S.role ? 'hub' : 'pick'); } } ]
};

N.pick = {
  where:'Before the story', title:'Who walks into Greyhollow?',
  text: () => [
    'Greyhollow is a river town on the Pontar, right on the line between two armies. Nilfgaard, the empire, holds the south bank. Redania, the kingdom, holds the north. Witch hunters from Oxenfurt ride through whenever the chapel sends a letter. The town sits on its one stone bridge and hopes nobody important notices it.',
    'Somebody important is about to.'
  ],
  pick:true
};

N.prologue = {
  where:'The Drowned Rat, Greyhollow', title:'The inn, and the thing in the chimney',
  cast: () => [NAME(), 'Berna the innkeeper', 'Pip'],
  text: () => [
    R('You ride into Greyhollow at dusk with two swords on your back and rain in your collar. The town is thirty houses and a stone bridge, and every one of the thirty houses watches you pass. The inn is called the Drowned Rat. The sign is a rat. It is, in fact, drowning.',
      'You ride into Greyhollow at dusk, and the town, which has been grey for three hundred years, notices. Men stop mid-sentence. A woman at a well forgets the bucket. You are used to it. You put a little more into the glamour anyway, out of habit, and the glamour takes it. The inn is called the Drowned Rat. The sign is a rat. It is, in fact, drowning.'),
    'Berna runs the inn. Sixty, wide, unimpressed by anything that has ever walked through her door. She puts a bowl of stew in front of you and a list on the table: everything wrong with her town, in order of what she would pay to have fixed. "You look like you fix things," she says. It is not a compliment.',
    'Then something falls down the chimney.',
    'It is the size of a cat, black with soot, with enormous eyes and a face like a very old child. It dusts itself off, climbs onto the table, looks you up and down, and says: "Right. I’m Pip. I’m a godling. That’s a house spirit, before you ask. I’ve lived in that chimney ninety years. I know everybody in this town by smell. I know who’s lying. I know where the bodies are, and I mean that literally, there are at least four. And you’re going to need me."',
    'Berna does not look up. "He does this," she says.',
    '<pip>"I’m coming with you. I’ll ride in your coat. I’ll be quiet mostly. When I talk, listen, because I’m usually right and I’m always smug about it."</pip>'
  ],
  choices: [
    { t:'"Fine. Stay out of the way."', do:()=>{S.metPip=1;}, out:()=>['Pip climbs into your coat pocket like it was built for him. It smells of soot for the rest of the story.'], next:'hub' },
    { t:()=>R('"I work alone."','"I do not travel with pets."'), do:()=>{S.metPip=1;}, out:()=>['Pip nods seriously, waits until you turn around, and climbs into your coat pocket anyway.','Berna, still not looking up: "He does this."'], next:'hub' }
  ]
};

N.hub = {
  where:'The Drowned Rat, Greyhollow', title:'The quest board',
  text: () => {
    const d = Object.keys(S.done).length;
    const open = [
      d===0 ? R('You take the corner table. The innkeeper, Berna, brings ale and a list of everything wrong with her town, in order of what she would pay to have fixed.',
                'You take the corner table and the room rearranges itself around you. Men stop mid-sentence. Berna the innkeeper brings wine without being asked and a list of everything wrong with her town, in order of what she would pay to have fixed.') : '',
      d===0 ? '<pip>"Start anywhere. The well’s the quietest. The bridge is the funniest. Don’t start with the hunters."</pip>' : '',
      d>0 && d<4 ? 'Berna wipes the table. Pip rustles in your pocket. The board has more on it than it did.' : '',
      d>=4 && !S.done.q5 ? 'Pip is not in the chimney. Pip is on the table, which has never happened, and Pip says: "Horns. On the south road. You should finish your drink."' : '',
      S.done.q5 ? 'The story is told. Pip says you can read the ledger again, or start over and see what the other one would have done.' : ''
    ].filter(Boolean);
    return open;
  },
  hub:true
};

// ===================== QUEST 1: SALT IN THE WELL =====================
N.q1a = {
  q:'q1', where:'The river road to Ashbrook', title:'Salt in the well',
  text: () => [
    'Ashbrook is an hour upriver: thirty houses, a mill, a shrine to whichever god was listening last, and one well. The well tastes of iron. Two cows are dead, a child is sick, and the village has decided this is the work of the widow Marga, who sells herbs and talks to her chickens.',
    'Berthold, the ealdorman (the village headman, the closest thing Ashbrook has to a mayor), has sent to Greyhollow for help. Sixty crowns to "deal with whatever is down there."',
    R('A child is sick and a village wants to burn an old woman. A witcher has seen this exact shape before. The monster is rarely the one they point at.',
      'You have been that old woman, in other villages, under other names. You feel the mood of a square the way other people feel weather.'),
    '<pip>Pip, from your pocket: "Ashbrook. Good bread, bad gossip. The miller’s wife cheats at dice. I’ll be quiet now."</pip>',
    'On the road in, a woman is running toward you with a boy in her arms.'
  ],
  choices: [
    { t:'Stop. Look at the boy.', out:()=>['His name is Tam. He is six. His lips are grey and his breathing is wrong, and his mother, Ida, has been carrying him since dawn because the village told her the witch did it and she does not know what else to do.'], next:'q1child' },
    { t:'Keep walking. The well first, then the sick.', do:()=>{S.f.q1passedChild=1;S.trust-=1;}, out:()=>['You tell her the healer in Greyhollow is an hour that way. She looks at you like you are made of wood.','Ashbrook hears about it before you reach the gate. Trust drops.'], next:'q1gate' }
  ]
};
N.q1child = {
  q:'q1', where:'The river road', title:'Tam',
  text: () => [
    R('You know poison when you see it. Not a curse. Something in the water, something that was alive once and is not now. White Honey would clear it from a witcher’s blood in an hour. In a six-year-old it would clear everything else too.',
      'You put your hand on his chest and feel it: not a curse. Rot. Something dead in the water, and its slow black breath in his lungs. You could burn it out of him. It would cost you, and someone on this road would see.'),
    'Ida is watching your hands.'
  ],
  choices: [
    { t:()=>R('Cut a White Honey draught ten to one with river water and make him drink it.','Burn it out of him. Here. Now.'), do:()=>{S.f.childSaved=1;S.trust+=2; if(!W()) S.eye+=1;}, out:()=>W()?['He vomits black for a full minute. Then he breathes. Then he asks for bread.','Ida does not say thank you. She says "Who else?" and you understand she means the well.','Ashbrook will remember this. Trust rises.']:['Light under your palm, and a smell like a struck match. He screams once, then breathes, then asks for bread.','Ida does not say thank you. She says "Who else?" and you understand she means the well.','Ashbrook will remember this. Trust rises. So does the chance someone on the road describes the light to the wrong person.'], next:'q1gate' },
    { t:'Tell her the truth: keep him off the well water, and he will mend. Slowly.', do:()=>{S.f.childSaved=0;S.trust+=0;}, out:()=>['She believes you, because you did not try to sell her anything.','Tam will be sick for a week. He will live. Ida will tell the village the stranger said it was the water, not the witch.'], next:'q1gate' }
  ]
};
N.q1gate = {
  q:'q1', where:'Ashbrook gate', title:'Three doors',
  text: () => [
    'Ashbrook at noon: shutters closed, a dog barking at nothing, and a knot of men by the shrine with a rope they are not using yet. The well is in the square. Berthold’s house is the only one with glass windows. Marga’s hut is at the far end of the lane, chickens loose in the road.',
    'You can do all three. The order matters, because the men with the rope are not going to wait all day.'
  ],
  choices: [
    { t:'The well. Look before you listen.', do:()=>{S.f.q1well=1;}, out:()=>['You go down first. Nobody argues.'], next:'q1well' },
    { t:'Marga, before the rope gets used.', do:()=>{S.f.q1margaFirst=1;S.f.q1marga=1;}, out:()=>['You reach her hut as two men with the rope are deciding whether to knock.','They see you and remember urgent business elsewhere.'], next:'q1marga' },
    { t:'Berthold. Follow the money.', do:()=>{S.f.q1bert=1;}, out:()=>['He pours you a drink before you ask a question. That is usually a question answered.'], next:'q1bert' }
  ]
};
N.q1well = {
  q:'q1', where:'The well', title:'What is down there',
  text: () => [
    R('You go down on a rope with a torch in your teeth. Thirty feet down, the water is black and cold and your medallion is humming hard enough to hurt.',
      'You do not go down. You prick your thumb, let one drop fall into the bucket, and the well tells you itself, in the back of your skull, like a man shouting underwater.'),
    'There is a body under the water. A soldier in Nilfgaardian black, throat cut, a millstone roped to his chest. He has been there about a month. A letter in his coat, half rotted: his name is Aurelio, he deserted at the Pontar crossing, and he was walking home to a town called Vicovaro to see his mother before she died.',
    'His killer left the knife in him. A hunting knife, good steel, with two letters burned into the handle. L. B.',
    'And he is not a drowner, the common river monster the village assumes. He is becoming a wraith: a ghost made from a bad death, angry, and tied to the place it died. In a day or two he will be done becoming.'
  ],
  choices: [
    { t:'Take the letter and the knife.', do:()=>{S.f.q1letter=1;}, out:()=>['Both go in your coat. The letter smells of river. His mother’s name is Livia.'], next:'q1hub' },
    { t:'Leave him as he is. Touch nothing.', out:()=>['You come back up with nothing but the name. The knife stays in him.','Without the knife there is no proof. Without the letter there is no address.'], next:'q1hub' }
  ]
};
N.q1marga = {
  q:'q1', where:'Marga’s hut', title:'The widow',
  text: () => S.f.q1margaFirst ? [
    'Marga is seventy and furious and not at all surprised to see you. She knows exactly what is in the well. She saw Lukas, the ealdorman’s son, at the well one night a month ago, with a rope, with something heavy, with the look of a boy who has just found out what he is.',
    'She has told nobody. "Who would I tell? Him?" She means Berthold.',
    R('She looks at your eyes for a long moment. "Cat eyes. My grandmother said your kind can tell a lie from a truth by the smell. Can you?" You can, a little. She is not lying.',
      'She looks you up and down. "Aretuza. I can smell it on you, girl. Chaos and expensive soap." Then, quieter: "They will come for me with a rope, and when they are done with me they will remember you."')
  ] : [
    'You find Marga tied to the shrine post in the square with a split lip and a crowd of six deciding what comes next. The rope is over the beam already.',
    'The miller, a wide man named Orm, has the end of it.'
  ],
  choices: [
    { t:'Promise to keep her name out of it.', if:()=>S.f.q1margaFirst, do:()=>{S.f.margaSafe=1;}, out:()=>['She nods once. "Then you carry it."'], next:'q1hub' },
    { t:'Ask her to stand up and say it in the square.', if:()=>S.f.q1margaFirst, do:()=>{S.f.margaWitness=1;S.trust+=1;}, out:()=>['She is quiet a long time. "If you are standing next to me. Not behind. Next to."','You agree. Trust rises; she has decided you are worth something.'], next:'q1hub' },
    { t:'Give her a charm that turns eyes away from her door.', who:'s', if:()=>S.f.q1margaFirst, do:()=>{S.f.margaSafe=1;S.f.margaCharm=1;S.eye+=1;}, out:()=>['You twist three of her chicken feathers and a hair of your own into a knot and hang it on the lintel. Nobody will find this hut tonight unless they already know the way.','Someone in the square saw the light in your hands. The Eternal Fire’s eye on you grows.'], next:'q1hub' },
    { t:'Talk Orm down. "Hang her and the well is still poisoned tomorrow."', if:()=>!S.f.q1margaFirst, do:()=>{S.f.q1margaBeaten=1;S.trust+=1;}, out:()=>['It takes a while. Orm wants to be talked down; he just wants it to look like he lost an argument, not a fight.','Marga walks home on her own feet, which is more than she expected. She will not testify to anything now. "I am done being brave for this village." Trust rises anyway.'], next:'q1hub' },
    { t:()=>R('Cut the rope. Let them look at the sword and think.','Cut the rope. Let them look at you and think.'), if:()=>!S.f.q1margaFirst, do:()=>{S.f.q1margaBeaten=1;S.trust-=1; if(!W()) S.eye+=1;}, out:()=>['Nobody argues with it. Nobody forgives it either.','Marga walks home. She will not testify to anything now. Trust drops.'], next:'q1hub' }
  ]
};
N.q1bert = {
  q:'q1', where:'The ealdorman’s house', title:'Berthold',
  text: () => [
    'Berthold is a big man gone soft, with a son he talks about too much and a wife he does not mention. He says the well has a drowner in it, obviously, and the old woman called it, obviously, and he would be grateful if you dealt with both and did not make a parade of it.',
    'He slides a purse across the table. Eighty crowns. Twenty more than the contract. "For discretion."',
    R('Your medallion does not react to lies. You do not need it to.', 'He is sweating the way men sweat when they think a woman has not noticed something.')
  ],
  choices: [
    { t:'Take the purse. Say nothing.', do:()=>{S.f.bribe=1;S.coin+=80;}, out:()=>['Eighty crowns heavier. He relaxes.','He thinks he has bought you. Whether he has is up to you.'], next:'q1hub' },
    { t:'Leave it on the table.', do:()=>{S.f.refused=1;}, out:()=>['"I was hired to find out what is in the well. I am going to find out."','His smile goes somewhere else.'], next:'q1hub' },
    { t:'Ask him where Lukas was a month ago.', do:()=>{S.f.refused=1;S.f.bertKnows=1;}, out:()=>['He stops breathing for a second. Then: "Hunting."','You both know what that means now.'], next:'q1hub' }
  ]
};
N.q1hub = {
  q:'q1', where:'Ashbrook', title:'The afternoon',
  text: () => {
    const n = (S.f.q1well?1:0)+(S.f.q1marga?1:0)+(S.f.q1bert?1:0);
    return [
      n>=3 ? 'You have seen the well, the widow, and the man with the glass windows. The sun is low.' : 'The sun is dropping. Whatever is in the well will be done becoming by dark.',
      (S.f.q1well && S.f.q1marga) ? 'You have a name and a knife that match. Lukas. L. B.' : S.f.q1well ? 'L. B. Half the men in Ashbrook have a B in their name. Only one of them has a father with glass windows.' : '',
      'Lukas himself has not been seen all day. His mother says he is at the hunting blind on the ridge.'
    ].filter(Boolean);
  },
  choices: [
    { t:'Look at the well.', if:()=>!S.f.q1well, do:()=>{S.f.q1well=1;}, out:()=>['You go to see it for yourself.'], next:'q1well' },
    { t:'Talk to Marga.', if:()=>!S.f.q1marga, do:()=>{S.f.q1marga=1;}, out:()=>['Her chickens are loose in the lane. Someone got here before you.'], next:'q1marga' },
    { t:'Talk to Berthold.', if:()=>!S.f.q1bert, do:()=>{S.f.q1bert=1;}, out:()=>['He is waiting with a drink and a very steady smile.'], next:'q1bert' },
    { t:'Go up to the hunting blind. Find Lukas before dark.', if:()=>!S.f.q1blind, do:()=>{S.f.q1blind=1;}, out:()=>['The ridge path is steep and the light is going.'], next:'q1blind' },
    { t:'Wait for nightfall at the well.', if:()=>S.f.q1well||S.f.q1marga, out:()=>['You sit with your back to the stone and wait for the thing to finish becoming.'], next:'q1night' }
  ]
};
N.q1blind = {
  q:'q1', where:'The hunting blind on the ridge', title:'Lukas',
  text: () => [
    'Lukas is nineteen, sitting in a hunting blind with a bow across his knees and a bottle he has not opened. He has been up here most days for a month. He knows why you are here before you say it.',
    'He says the soldier was in their barn at night, stealing the winter seed. He says he only meant to scare him. He says the man laughed at him, in Nilfgaardian, and then it was done and he did not remember doing it. He says it twice.',
    'On the floor of the blind is a Nilfgaardian coin purse with eleven florens in it. Aurelio’s. Lukas has not spent one.'
  ],
  choices: [
    { t:'Tell him what is in the well now, and what it will do to the village.', do:()=>{S.f.lukasTold=1;}, out:()=>['He goes white. He did not know. He thought a body in a well was a body in a well.','"What do I do?" You tell him to be at the well at midnight. He will come. You can see it.'], next:'q1hub' },
    { t:'Take the purse. Say nothing yet.', do:()=>{S.f.q1purse=1;S.coin+=11;}, out:()=>['Eleven florens. Nilfgaardian silver. He watches you pocket it and does not ask.','Now he thinks you can be paid. That may be useful.'], next:'q1hub' },
    { t:()=>R('Axii him, gently. "You will tell your father tonight."','Look him in the eye and let him feel it. "You will tell your father tonight."'), do:()=>{S.f.lukasConfess=1; if(!W()) S.eye+=1;}, out:()=>['He walks down the ridge like a man in a dream and into his father’s house with the glass windows.','By the time you reach the square, Berthold is standing in his doorway looking at nothing. He knows. Everyone will know by morning.'], next:'q1hub' }
  ]
};
N.q1night = {
  q:'q1', where:'The well, midnight', title:'Aurelio',
  text: () => [
    'He comes up out of the well like smoke that forgot it was supposed to rise. Black coat, open throat, a face that is still mostly a face. He speaks Nilfgaardian, then Common, then just sound. He is asking which way is south. He is asking for his mother.',
    S.f.q1well ? 'You know his name. That matters more than silver.' : 'You never went down. You do not know his name, and he can tell.',
    S.f.lukasTold ? 'Lukas is here. Standing at the edge of the square with his bow and no arrows, because you told him not to bring any. The wraith turns toward him first.' : '',
    R('Silver out. Yrden ready. You could end this in a minute.', 'He feels you before he sees you. Wraiths and sorceresses recognize each other. Neither likes it.')
  ],
  choices: [
    { t:'Fight. End it clean.', do:()=>{S.f.wraith='destroyed'; if(!W()) S.eye+=2;}, out:()=>W()?['Yrden traps him on the stones. The silver does the rest. He screams like a man and comes apart like a sheet in wind.','Clean. Quick. Nothing laid to rest, only stopped.']:['You bind him in a circle of light bright enough to be seen from the chapel, and you unmake him with a word your teachers told you never to use in public.','It worked. Half the village saw the light. The Fire’s eye on you grows.'], next:'q1dawn' },
    { t:'Lay him to rest. Give him his name, burn the knife, let the boy say it.', if:()=>S.f.q1well && S.f.q1letter && (W() ? (S.f.q1marga && S.f.q1margaFirst) || S.f.lukasTold : true), do:()=>{S.f.wraith='rested'; S.trust+=1;}, out:()=>W()?[S.f.lukasTold?'You cannot do a rite. But a killer can. Lukas stands at the well and says the name three times into the water, and you hold the knife in a fire until the handle goes.':'You cannot do a rite. Marga can. She stands at the well with you and says his name three times into the water while you hold the knife in a fire.','He turns south. He goes. The well is only a well.','The village saw it. Trust rises.']:['You say his name into the water three times and burn the knife in your bare hand, which hurts exactly as much as it should.',S.f.lukasTold?'Lukas says "I’m sorry" to a dead man, in a voice that cracks. It is not nothing.':'','He turns south. He goes. The well is only a well.','Nobody saw a light, because there was none. The village saw you cry a little, which did you more good than a spell.'].filter(Boolean), next:'q1dawn' },
    { t:'Lay him to rest. (You need his name, his letter, and someone who can say it: Marga unshaken, or Lukas willing.)', if:()=>!(S.f.q1well && S.f.q1letter && (W() ? (S.f.q1marga && S.f.q1margaFirst) || S.f.lukasTold : true)), disabled:true },
    { t:()=>R('Axii. Point him at the river and let him walk.','Glamour. Show him the river and call it the road home.'), do:()=>{S.f.wraith='river';}, out:()=>['He believes you. He walks into the Pontar and under it, still asking for his mother.','The well is clean. The river is not. Something is in it now that remembers you.'], next:'q1dawn' },
    { t:'Let him have Lukas. The boy is standing right there.', if:()=>S.f.lukasTold, do:()=>{S.f.wraith='fed';S.f.lukas='dead';S.trust-=2;}, out:()=>['You step aside. It takes about as long as you would think.','When it is over the wraith is gone, satisfied, and Lukas is at the bottom of the well with the man he put there.','Ashbrook saw you step aside. Trust drops hard.'], next:'q1dawn' }
  ]
};
N.q1dawn = {
  q:'q1', where:'Ashbrook, dawn', title:'The boy',
  text: () => S.f.lukas==='dead' ? [
    'Berthold stands at the well at dawn and does not look down it. He does not ask you anything. He goes back inside and closes the shutters.',
    'Ashbrook is quiet in the way a place is quiet when it has decided something about you.'
  ] : [
    S.f.lukasConfess ? 'The whole village is in the square at dawn, because Berthold’s son confessed in his father’s kitchen last night and the maid heard it through the floor. Lukas is standing by the well with his hands at his sides.' :
    S.f.lukasTold ? 'Lukas is at the well at dawn, where you left him, grey-faced, waiting to find out what you are going to do.' :
    'Lukas is waiting for you at the gate with a hunting bow across his knees, which tells you he knows. He says the soldier was stealing their winter seed. He says he only meant to scare him. He says it twice.',
    'His father is on the porch behind him, not coming down the steps.',
    S.f.bribe ? 'Berthold’s eighty crowns are in your coat.' : '',
    S.f.childSaved ? 'Ida is in the crowd with Tam on her hip. She is watching you, not Lukas.' : ''
  ],
  choices: [
    { t:'Name him in the square. Let the village judge.', if:()=>S.f.lukas!=='dead', do:()=>{S.f.lukas='hanged'; S.trust+=2; if(S.f.bribe){S.coin-=80;S.f.bribe=0;}}, out:()=>['Village law is old and short. Berthold hangs his own son from the mill beam because no one else will, and then sits under him until noon.','Ashbrook trusts you now. Ashbrook also has no one left who can draw a bow.', S.f.margaWitness?'Marga stood next to you and said it. You stood next to her.':'', S.f.bribe?'You threw Berthold’s purse at his feet.':''].filter(Boolean), next:'q1letter' },
    { t:'Deal with him privately. He owes you now.', if:()=>S.f.lukas!=='dead', do:()=>{S.f.lukas='owes';}, out:()=>['You walk him to the river and tell him what you found and what you did with it. He is sick in the reeds. Then he asks what you want.','You tell him you will come for it someday. He believes you.','Nobody hangs. Berthold never stops looking at you.'], next:'q1letter' },
    { t:'Make him Ashbrook’s problem. Exile, not a rope.', if:()=>S.f.lukas!=='dead', do:()=>{S.f.lukas='exiled';S.trust+=1;}, out:()=>['Berthold argues. Orm the miller does not. Lukas walks out of the north gate with his bow, a loaf, and the eleven florens, if you gave them back.','He will end up in someone’s army. Everyone does.'], next:'q1letter' },
    { t:'Blame the drowner. Take the money. Leave.', if:()=>S.f.bribe && S.f.lukas!=='dead', do:()=>{S.f.lukas='free'; S.trust-=2; S.f.marga='gone';}, out:()=>['You tell the square it was a drowner and ride out with Berthold’s crowns.','You hear later the village burned Marga’s hut the same night. She was not in it. Nobody knows where she went.','Trust drops. Lukas keeps his bow.'], next:'q1letter' },
    { t:'Leave. There is nothing left to decide.', if:()=>S.f.lukas==='dead', out:()=>['You go.'], next:'q1letter' }
  ]
};
N.q1letter = {
  q:'q1', where:'The river road back', title:'Vicovaro',
  text: () => S.f.q1letter ? [
    'Aurelio’s letter is still in your coat. His mother’s name is Livia, in Vicovaro, a town deep in Nilfgaard. She was dying a month ago. She may be dead now. She may not.',
    'A Nilfgaardian grain merchant crosses the bridge every ten days under a trade flag. He will carry a letter south for a price, and he will not ask what is in it.'
  ] : [
    'You never took the letter from the well. Whoever Aurelio was walking home to will never know how far he got.',
    'The river road is quiet all the way back.'
  ],

    { t:'Keep the letter. One day it may be worth something to someone.', if:()=>S.f.q1letter, do:()=>{S.f.letterKept=1;}, out:()=>['It stays in your coat, smelling of river.'], next:'q1end' },
    { t:'Burn it. The dead do not need mail.', if:()=>S.f.q1letter, out:()=>['It goes up in a second. Pip says nothing, which for Pip is a speech.'], next:'q1end' },
    { t:'Ride on.', if:()=>!S.f.q1letter, out:()=>[], next:'q1end' }
  ]
};
N.q1end = { q:'q1', end:true, where:'Ashbrook', title:'Salt in the well, closed',
  text: () => [
    'What you leave behind in Ashbrook:',
    S.f.wraith==='rested' ? 'Aurelio went home.' : S.f.wraith==='destroyed' ? 'Aurelio is gone, which is not the same as home.' : S.f.wraith==='fed' ? 'Aurelio took what he was owed.' : 'Aurelio is in the river.',
    S.f.lukas==='hanged' ? 'Lukas hangs from the mill. His father will not speak your name.' : S.f.lukas==='owes' ? 'Lukas lives, and owes you.' : S.f.lukas==='exiled' ? 'Lukas is on the north road with a bow.' : S.f.lukas==='dead' ? 'Lukas is in the well.' : 'Lukas got away with it, and the village burned an old woman’s house for your silence.',

// ===================== QUEST 2: THE TOLL =====================
N.q2a = {
  q:'q2', where:'Greyhollow council chamber', title:'The toll',
  text: () => [
    'Since the Redanian garrison marched north, a troll has taken the stone bridge. His name is Bogdan. He charges a toll: a wheel of cheese, or a story he has not heard. Carts will not pay in cheese, merchants will not pay in stories, and the ferryman, Jens, has started charging what a man charges when he is the only ferry.',
    'The council is five people shouting. Alderman Hodd wants the bridge cleared and offers a hundred crowns. Jens, at the back, offers twenty more for it to stay exactly as it is. The grain merchants want a bridge and do not care who stands on it. Old Berna from the inn wants to know why nobody has simply asked the troll what he wants.',
    '<pip>Pip, the godling from the inn chimney, in your pocket: "Bogdan’s all right. It’s the cheese that’s the problem. Nobody in this town can make cheese."</pip>'
  ],
  choices: [
    { t:'Take Hodd’s contract. A hundred crowns for a clear bridge.', do:()=>{S.f.q2contract='hodd';}, out:()=>['Hodd shakes your hand. Jens leaves without finishing his drink.'], next:'q2scouts' },
    { t:'Take Jens’s twenty on the side as well. Nobody needs to know.', do:()=>{S.f.q2contract='both';S.coin+=20;S.trust-=1;}, out:()=>['Twenty crowns from a man who wants the opposite of what you were just paid to do. Pip says "Oh, that’s not going to stay secret."','It does not. Trust drops.'], next:'q2scouts' },
    { t:'Ask Berna’s question. What does the troll actually want?', do:()=>{S.f.q2contract='berna';S.f.q2asked=1;S.trust+=1;}, out:()=>['The room goes quiet, which in this room is a miracle. Hodd says the contract stands either way.','Berna slides you a wheel of cheese across the table. "In case he’s hungry." Trust rises.'], next:'q2scouts' }
  ]
};
N.q2scouts = {
  q:'q2', where:'The south bank road', title:'Riders in black',
  text: () => [
    'On the way to the bridge you meet three Nilfgaardian scouts coming the other way: black cloaks, good horses, maps. They are counting. Bridges, fords, how many men a town could put on a wall. They are polite, the way an army is polite before it arrives.',
    'Their sergeant asks you, as a traveler, whether the Greyhollow bridge is held.',
    R('He is looking at your swords. He knows what they mean. Witchers are neutral, as far as empires are concerned, and empires are never quite sure.', 'He is looking at you the way men look at you, and then a second time the way soldiers look at a map. He has seen sorceresses at court. He is trying to decide if you are one.')
  ],
  choices: [
    { t:'Tell him the truth. A troll holds it, and the town has no garrison.', do:()=>{S.f.scouts='told';}, out:()=>['He writes it down. He thanks you. He means it.','Whatever comes up this road later will know exactly what is waiting.'], next:'q2bridge' },
    { t:'Lie. "A Redanian company. Crossbows on both towers."', do:()=>{S.f.scouts='lied';}, out:()=>['He looks at you a long moment. Then writes it down anyway.','It will cost whoever comes up this road an extra day of caution. A day can matter.'], next:'q2bridge' },
    { t:()=>R('Kill them. Three fewer maps in Nilfgaard.','Kill them. Quietly. Three men fall off three horses and the horses go home alone.'), do:()=>{S.f.scouts='dead';S.eye+= W()?0:1;}, out:()=>W()?['It is over in a minute. You push the bodies into the reeds and send the horses south.','Nilfgaard will notice three scouts not coming home, and will not know why. That is a different kind of warning.']:['Three men go to sleep in their saddles and do not wake up. The horses go home alone.','Nilfgaard will notice three scouts not coming home, and will not know why. Someone will say the word "witch."'], next:'q2bridge' }
  ]
};
N.q2bridge = {
  q:'q2', where:'The stone bridge', title:'Bogdan',
  text: () => [
    'Bogdan is nine feet of river rock with moss for eyebrows and a toll-collector’s satchel that used to be a Redanian saddlebag. He stands in the middle of the bridge with his arms folded and says: "Toll. Cheese or story. No story about a dog. Bogdan has heard every dog story."',
    R('Your medallion barely stirs. Rock trolls are not monsters, whatever the council thinks. They are just very large and very bad at negotiating.',
      'He looks at you the way a very large child looks at a very fancy cake. "Pretty lady is a story herself," he says, which is the nicest thing anyone has said to you in Greyhollow.'),
    S.f.q2asked ? 'Berna’s cheese is under your arm.' : ''
  ],
  choices: [
    { t:'Pay in cheese.', if:()=>S.f.q2asked, do:()=>{S.f.trollFriend=1;}, out:()=>['He eats the whole wheel in two bites and sits down on the bridge, overcome. "Berna," he says. "Berna makes this?" You say yes. He is in love.','You may cross forever. Also he wants to show you something under the bridge.'], next:'q2riddle' },
    { t:'Pay in a story. Tell him something true about yourself.', do:()=>{S.f.trollFriend=1;S.f.trollTruth=1;}, out:()=>W()?['You tell him about the Trial of the Grasses. Three boys went in with you. One came out.','He is quiet for a long time. Then he says you can cross for free forever, and asks if you want to see what is under the bridge.']:['You tell him about the night Aretuza found out what you could really do, and what it cost the girl in the next bed.','He is quiet a long time. Then he says you can cross for free forever, and asks if you want to see what is under the bridge.'], next:'q2riddle' },
    { t:'Pay in a story. Make one up.', do:()=>{S.f.trollFriend=1;}, out:()=>['You tell him about a dragon that fell in love with a lighthouse. He loves it. He does not know it is nonsense.','He says you can cross, and asks if you want to see what is under the bridge.'], next:'q2riddle' },
    { t:'Fight. The council wants a bridge.', do:()=>{S.f.troll='dead';S.trust+=1;S.coin+=100;}, out:()=>W()?['It takes eleven minutes and most of a wall. He dies apologizing for breaking the wall.','A hundred crowns. The town cheers. Pip does not speak to you for a day.']:['You drop the bridge’s own cobbles on him from above. He dies confused.','A hundred crowns. The town cheers. Pip does not speak to you for a day. Half the town saw you lift stone with a gesture.'], next:'q2under_dead' },
    { t:()=>R('Threaten him. Trolls understand a witcher.','Threaten him. Let him see what you are.'), do:()=>{S.f.trollScared=1; if(!W()) S.eye+=1;}, out:()=>['He steps back. He is not stupid. But his eyes go to the edge of the bridge, down, and back to you, and you understand he is not scared for himself.'], next:'q2under' }
  ]
};
N.q2riddle = {
  q:'q2', where:'The stone bridge', title:'Bogdan’s game',
  text: () => [
    'Before he shows you anything, Bogdan wants to play. "Riddle. Bogdan asks, you answer. Get it right, Bogdan tells you a secret. Get it wrong, Bogdan is sad." He sits down, which takes a while.',
    '"What has a bed but never sleeps, a mouth but never eats, and runs but never walks?"'
  ],
  choices: [
    { t:'A river.', do:()=>{S.f.q2riddle=1;}, out:()=>['He claps, which sounds like a rockslide. "YES. Secret: the Redanian captain who left? He left because he was paid to. Nilfgaard gold. Bogdan saw the purse."','So the garrison did not march north. It was bought off. Someone wanted this bridge unguarded.'], next:'q2under' },
    { t:'A troll.', out:()=>['He thinks about it. "No. But Bogdan likes that you said Bogdan." He is sad anyway, briefly.','No secret. You climb down to the ledge.'], next:'q2under' },
    { t:'Skip the game. Show me what is under the bridge.', out:()=>['"No game, no secret." He shrugs, which is a geological event, and leads you down.'], next:'q2under' }
  ]
};
N.q2under = {
  q:'q2', where:'Under the bridge', title:'What the troll was guarding',
  text: () => [
    'Under the arch, on a ledge above the waterline, there is a camp. Four elves. A mother, a grandfather, two children, thin as the reeds. To Redania any elf off the road is a Scoia’tael rebel, which means a rope. To Nilfgaard they are deserters from the elf units it conscripted, which means the same rope, slower.',
    '"They make cheese," Bogdan says, as if that settles it. "Good cheese. Bogdan keeps bridge. They keep cheese. Everybody keeps."',
    'The mother looks at you the way the hunted look at anyone with a weapon. The grandfather does not look at you at all. He is looking at the water.'
  ],
  choices: [
    { t:'Sit down. Ask the grandfather where they are going.', do:()=>{S.f.q2talked=1;}, out:()=>['He speaks slowly, in a Common that is older than yours. Mahakam, the dwarf mountains to the east. There are elves in the high valleys there that the kingdoms have not bothered to hunt yet. His son died getting them this far.','He says: "The troll is kinder than any man we have met since the Pontar." He is not trying to make you feel anything. It works anyway.'], next:'q2decide' },
    { t:'Keep your distance. You have seen refugees before.', out:()=>['You stay on the steps. The children watch you the whole time.'], next:'q2decide' }
  ]
};
N.q2decide = {
  q:'q2', where:'Under the bridge', title:'Everybody keeps',
  text: () => [
    'Hodd wants a bridge. Jens wants a troll. The elves want a night’s head start. Bogdan wants cheese and for everyone to stop asking him to move.',
    S.f.q2riddle ? 'And someone paid the Redanian garrison to leave this bridge empty. That someone is going to come back for it.' : ''
  ],
  choices: [
    { t:'Make Bogdan the town’s bridge-keeper. Toll in coin, split with the council.', do:()=>{S.f.troll='keeper';S.trust+=1;S.coin+=40;}, out:()=>['It takes an afternoon of shouting. Hodd hates it. Jens hates it more. The merchants do the arithmetic and decide a troll who takes two crowns a cart is cheaper than a ferry that takes ten.','Bogdan gets a hat. The town gets a bridge. Forty crowns for the brokering.','Nobody mentions the elves. You did not mention them either.'], next:'q2elves' },
    { t:'Kill him anyway. A bridge is a bridge.', do:()=>{S.f.troll='dead';S.trust+=1;S.coin+=100;}, out:()=>['He does not fight back much. He keeps looking at the ledge.','A hundred crowns. The elves are alone now.'], next:'q2elves' },
    { t:'Tell Hodd about the elves. The council pays for that too.', do:()=>{S.f.elves='reported';S.f.troll=S.f.troll||'keeper';S.coin+=60;S.eye=Math.max(0,S.eye-2);S.trust+=1;}, out:()=>['Hodd pays sixty crowns and sends a rider to the Redanian picket. The elves are gone by morning. You do not ask where.','The chapel notes that you are loyal. The Fire’s eye on you softens.','Pip climbs out of your pocket and walks home.'], next:'q2end' }
  ]
};
N.q2under_dead = {
  q:'q2', where:'Under the bridge', title:'What he was guarding',
  text: () => [
    'You find the camp while looking for his hoard. There is no hoard. There are four elves on a ledge above the water, a mother, a grandfather, two children, and a half-wheel of very good cheese.',
    '"He said no one would come," the mother says. "He said he was the toll."'
  ],
  choices: [
    { t:'Help them cross north tonight.', out:()=>['You will need the Redanian picket to look the other way.'], next:'q2elves' },
    { t:'Tell Hodd. Collect the second bounty.', do:()=>{S.f.elves='reported';S.coin+=60;S.eye=Math.max(0,S.eye-2);}, out:()=>['Sixty more crowns. A rider to the picket. The ledge is empty by morning.','The chapel notes your loyalty. Pip walks home.'], next:'q2end' },
    { t:'Leave them. Not your contract.', do:()=>{S.f.elves='left';}, out:()=>['You climb back up to the bridge and collect your money.','Someone else will find them. Someone always does.'], next:'q2end' }
  ]
};
N.q2elves = {
  q:'q2', where:'The north bank, after dark', title:'The crossing',
  text: () => [
    'The Redanian picket is six bored men and a lantern. The elves need to be past them and into the Mahakam foothills before dawn.',
    R('Axii works on one man at a time. Six is a lot. Or there is the river, and Quen, and a very cold swim.', 'You could put six men to sleep with one word. Six men would also wake up knowing exactly what put them there.'),
    'The grandfather says he will not make the swim. He says it like a man stating the weather.'
  ],
  choices: [
    { t:()=>R('Axii the sergeant. Walk them through like you own the road.','Glamour the whole picket. Six men dream of their mothers for an hour.'), do:()=>{S.f.elves='saved'; if(!W()) S.eye+=2;}, out:()=>W()?['The sergeant waves you through and does not remember doing it. The grandfather kisses your hand. The children do not look back.','Somewhere in the hills, four people owe you.']:['Six men sit down in the road and smile at nothing. The grandfather kisses your hand. The children do not look back.','Somewhere in the hills, four people owe you. Six men will wake up and remember a woman walking past them in a light that was not the lantern. The Fire’s eye on you grows.'], next:'q2picket' },
    { t:'Take them across the water, below the picket, the hard way. Carry the old man.', do:()=>{S.f.elves='saved';}, out:()=>['Cold enough to stop a heart. The grandfather’s nearly does. You carry him the last hundred yards on your back.','Nobody saw. Four people owe you.'], next:'q2picket' },
    { t:'Bribe the picket. Twenty crowns and the sergeant goes blind for an hour.', if:()=>S.coin>=20, do:()=>{S.f.elves='saved';S.coin-=20;S.f.q2bribedPicket=1;}, out:()=>['The sergeant takes the money and turns his back and says, to nobody, "I did not see four elves and I will not see them again."','Four people owe you. So, in a way, does a Redanian sergeant who now has a secret.'], next:'q2picket' },
    { t:'This is too far. Wish them luck.', do:()=>{S.f.elves='left';}, out:()=>['The mother nods like she expected it. They go into the dark on their own.','You do not find out what happens to them. That is its own kind of answer.'], next:'q2end' }
  ]
};
N.q2picket = {
  q:'q2', where:'The north bank, before dawn', title:'The thing the grandfather said',
  text: () => [
    'At the treeline the grandfather stops and takes your hand again. He says, in the old Common: "You will need us. Not soon. But you will. When the horns come, light a fire on the north tower and we will see it."',
    'Then they are gone into the hills, and it is just you and the river and Pip, who is pretending not to have cried.',
    S.f.q2bribedPicket ? 'On the way back the sergeant stops you. He wants to know if there will be more. He is not threatening. He is asking what the rate is.' : ''
  ],
  choices: [
    { t:'Go home. Light a fire on the tower someday.', do:()=>{S.f.elfSignal=1;}, out:()=>['You remember it. Pip remembers it louder.'], next:'q2end' },
    { t:'Tell the sergeant there will be more, and the rate is the same.', if:()=>S.f.q2bribedPicket, do:()=>{S.f.elfSignal=1;S.f.sergeantFriend=1;}, out:()=>['He nods. A Redanian sergeant who takes elf money is a Redanian sergeant who will not look too hard at anything else either.','You have bought a hole in the north bank. It may be useful.'], next:'q2end' }
  ]
};
N.q2end = { q:'q2', end:true, where:'Greyhollow', title:'The toll, closed',
  text: () => [
    'The bridge tonight:',
    S.f.troll==='keeper' ? 'Bogdan stands on it in a hat, taking two crowns a cart and telling everyone the dragon story.' : S.f.troll==='dead' ? 'Bogdan is a pile of rock at the foot of the arch. Carts roll over him.' : 'Bogdan still holds it, and Jens still charges what he likes.',
    S.f.elves==='saved' ? 'Four elves are in the Mahakam hills, alive, because of you.' + (S.f.elfSignal ? ' They told you to light a fire on the north tower when the horns come.' : '') : S.f.elves==='reported' ? 'Four elves went north in Redanian irons. The chapel thinks well of you.' : 'Four elves are somewhere. You did not ask.',
    S.f.scouts==='told' ? 'Nilfgaard knows the bridge is held by a troll and nothing else.' : S.f.scouts==='lied' ? 'Nilfgaard thinks there are crossbows on the towers.' : 'Three Nilfgaardian scouts did not come home.',
    S.f.q2riddle ? 'Someone paid the Redanian garrison to leave. You do not know who yet.' : '',
    'A bridge is the kind of thing that matters most on the one night it matters.'
  ].filter(Boolean)
};

// ===================== QUEST 3: THE SPARK =====================
N.q3a = {
  q:'q3', where:'Greyhollow square', title:'The spark',
  text: () => [
    'Captain Tybalt Rook of the Eternal Fire, Redania’s church and its witch-burning police, rides in with six men and a cage on wheels. He is handsome, soft-spoken, and has burned eleven women this year, which he mentions during the sermon the way a farmer mentions rain.',
    'He is here because a letter said a child in this town sets things on fire when she is frightened. Liesl, the baker’s girl. Twelve. The bread has been coming out black for a month. He says he will be here three days, and that he always finds what he comes for.',
    S.eye>=5 ? R('Rook’s eyes find you in the crowd and stay there. He knows what a witcher is. He does not like it.', 'Rook’s eyes find you in the crowd and stay there. He is not looking at a woman. He is looking at a pyre with a woman in front of it.')
            : R('Rook glances at you, files "mutant" under later, and moves on.', 'Rook’s eyes slide over you, pause, and move on. Good. The glamour on your face is holding.'),
    '<pip>Pip, the godling from the inn chimney, from inside your coat: "He’s a bad one. I can smell what he had for breakfast and it was a person’s fear."</pip>',
    'The sermon ends with a question to the crowd: does anyone here know the girl?'
  ],
  choices: [
    { t:'Say nothing. Find the baker before Rook does.', out:()=>['Matthis the baker is already in the inn’s back room with his daughter and the look of a man who has stopped sleeping.'], next:'q3b' },
    { t:'Speak up. "Every child in Velen has burned a loaf. Go home."', do:()=>{S.trust+=1;S.eye+=1;S.f.q3spoke=1;}, out:()=>['The square laughs. Rook does not. He writes something in a small book without looking down at it.','Greyhollow likes you for it. So does Rook, in the way a cat likes a mouse that moved.'], next:'q3b' }
  ]
};
N.q3b = {
  q:'q3', where:'The Drowned Rat, back room', title:'Liesl',
  text: () => [
    'Liesl is small for twelve and will not look up. When Matthis says the word "hunters" the candle on the table goes from a flame to a torch and back. He flinches. She flinches harder.',
    R('You have seen this before. A Source: someone born with magic that leaks out before anyone teaches them to hold it. In the old days a child like this got sent to a magic school, Aretuza for girls, Ban Ard for boys. In Redania now, she gets a cage.',
      'You know exactly what she is, because you were. Raw Chaos, no training, and a world that would rather burn it than teach it.'),
    'Liesl finally looks up. "Am I a monster?" she asks you. Not her father. You.'
  ],
  choices: [
    { t:'"No. You are a girl who can do something most people cannot. That is all."', do:()=>{S.f.q3kind=1;}, out:()=>['She nods like she is deciding whether to believe it. The candle settles.','Matthis breathes for what might be the first time today.'], next:'q3letter' },
    { t:()=>R('"I am a monster, by most people’s reckoning. So is half of what I hunt. The word does not mean much."','"I am what they call a witch. Look at me. Do I look like a monster to you?"'), do:()=>{S.f.q3honest=1;}, out:()=>W()?['She looks at your eyes for a long time. "They’re yellow." "Yes." "Do people run?" "Some." She thinks about that and seems, oddly, comforted.']:['She looks at you the way girls look at you, which is to say: like you are the answer to a question she had not finished asking. "No," she says. "You look like a queen."'], next:'q3letter' },
    { t:'"The Fire thinks so. That is the only opinion that matters for the next three days."', do:()=>{S.f.q3cold=1;}, out:()=>['The candle flares. Matthis puts his hand over it without thinking and burns his palm.','True. Not helpful. She does not look up again.'], next:'q3letter' }
  ]
};
N.q3letter = {
  q:'q3', where:'The Drowned Rat, back room', title:'Who wrote the letter',
  text: () => [
    'Rook came because of a letter. Someone in Greyhollow wrote to Oxenfurt about a baker’s girl. Matthis has been thinking about nothing else for a month.',
    '<pip>Pip, quietly: "I know who. The chapel clerk. Father Ansel’s clerk, Dren. He smells like wax and spite. Ansel didn’t know. Ansel’s soft."</pip>',
    'Father Ansel is the town’s priest of the Eternal Fire. Soft, Pip says. Dren is the one who keeps his books.'
  ],
  choices: [
    { t:'Go see Father Ansel. If he is soft, he is useful.', do:()=>{S.f.q3ansel=1;}, out:()=>['Ansel is sixty, frightened of his own captain, and has been sick about this letter since he found out it was sent. He will not stand up to Rook. He will, he says carefully, be very slow at finding things if asked to help search.','You have a priest who will drag his feet. It is not nothing.'], next:'q3b2' },
    { t:'Go see Dren. Find out why.', do:()=>{S.f.q3dren=1;}, out:()=>['Dren is twenty-five and owes the bakery money. That is the whole reason. A debt, a letter, a child in a cage.',R('You do not hit him. You let him understand that you thought about it.','You do not hex him. You let him see you decide not to.'),'He will not be writing any more letters. He may also tell Rook you threatened him.'], next:'q3b2' },
    { t:'It does not matter who. Deal with the girl.', out:()=>['Pip sulks. "It always matters who."'], next:'q3b2' }
  ]
};
N.q3b2 = {
  q:'q3', where:'The Drowned Rat, back room', title:'Three days',
  text: () => [
    'Rook has three days and six men. They will search every house. Matthis asks what you can do.'
  ],
  choices: [
    { t:'Hide her in the inn chimney. Pip will keep her company.', do:()=>{S.f.liesl='hidden';}, out:()=>['Pip is delighted. "I’ve never had a guest." Liesl climbs up with a blanket and a loaf of bread.','It is a good hiding place. It is only a hiding place, and Rook has three days.'], next:'q3hodd' },
    { t:'Teach her. Tonight. Control, not fear.', who:'s', do:()=>{S.f.liesl='trained';S.eye+=2;}, out:()=>['You spend the night in the cellar with her and three candles. By midnight she can light one without lighting the others. By dawn she can put one out.',S.f.q3kind||S.f.q3honest?'She looks at you like you hung the moon. You remember a woman who looked at you like that once, before she burned.':'She learns it anyway. She does not look at you while she does.','Two candles’ worth of light leaked under the cellar door. The Fire’s eye on you grows.'], next:'q3hodd' },
    { t:'Teach her to lie. Axii for the nerves, and a story she can hold.', who:'w', do:()=>{S.f.liesl='coached';}, out:()=>['You cannot teach her magic. You can teach her to be boring. A calm face, a dull story, and a little Axii so her hands do not shake.','It will hold for one interrogation. Maybe.'], next:'q3hodd' },
    { t:'Send her to Marga in Ashbrook. An old woman with chickens is the last place anyone looks.', if:()=>S.done.q1 && S.f.marga!=='gone', do:()=>{S.f.liesl='marga';}, out:()=>['Matthis drives her out before dawn in a cart of flour sacks.','Marga meets them at the gate, takes one look at the girl, and says "Oh, you’re one of mine." Nobody knows what she means by it.'], next:'q3hodd' },
    { t:'Send her to Auntie Yew in Nettle Fen. The hag will take a child like this.', do:()=>{S.f.liesl='hag';S.trust-=1;}, out:()=>['Pip goes very still. "Yew keeps what she takes."','Matthis does it anyway, because a hag is not a pyre. Liesl walks into the fen holding a stranger’s hand and does not look back.','The town hears where she went. Trust in you drops.'], next:'q3hodd' }
  ]
};
N.q3hodd = {
  q:'q3', where:'Alderman Hodd’s house', title:'The alderman’s offer',
  text: () => [
    'Hodd sends for you after dark. He has a bottle open and the shutters closed. He is a practical man. He has done the arithmetic: a witch hunter who leaves happy is cheaper than a witch hunter who leaves angry.',
    '"I don’t care about the girl," he says. "I care about the town. Give him something. Give him the girl, give him the old woman in Ashbrook, give him a stranger off the road. He goes home, we go back to work."',
    S.f.elves==='reported' ? 'He likes you. You handed him the elves. He thinks you understand how things work.' : 'He does not like you much. He thinks you make things complicated.'
  ],
  choices: [
    { t:'"Give him nothing. He leaves with an empty cage or he leaves with a problem."', do:()=>{S.f.q3hoddNo=1;S.trust+=1;}, out:()=>['Hodd sighs. "Then it’s on you." He means it as a threat. It is also, you notice, an admission.','The town will hear you said it. Trust rises.'], next:'q3c' },
    { t:'"Give him Dren. The clerk wrote the letter. Let the Fire eat its own."', if:()=>S.f.q3dren, do:()=>{S.f.q3hoddDren=1;S.trust-=0;}, out:()=>['Hodd thinks about it for exactly as long as it takes to pour another drink. "The clerk. Yes. The clerk has always been a problem."','Rook will have a name by morning. It will not be Liesl’s. It will not be yours. Pip says "Huh," in a tone you cannot read.'], next:'q3c' },
    { t:'Take Hodd’s side. The town first. Point Rook at a stranger on the road.', do:()=>{S.f.q3hoddYes=1;S.trust-=2;S.eye=Math.max(0,S.eye-1);}, out:()=>['A tinker camped by the mill. Nobody knows his name. By noon tomorrow nobody will need to.','Hodd shakes your hand. The town does not. Trust drops hard. The Fire’s eye on you softens.'], next:'q3c' }
  ]
};
N.q3c = {
  q:'q3', where:'The square, next morning', title:'Questions',
  text: () => [
    S.f.q3hoddYes ? 'The tinker is in the cage. He is shouting that he has never done magic in his life, which is true, and which Rook has heard before.' : S.f.q3hoddDren ? 'Dren the clerk is in the cage, white as his own candles. Father Ansel is standing beside it with his hands folded, saying nothing, which is the bravest thing he can manage.' : '',
    'Rook asks to speak with you anyway. Alone, he says, and then brings two men. He is polite. He knows what you are. He asks where the baker’s girl is, and then, before you answer, he asks about Ashbrook, and the bridge, and a light some people saw.',
    R('He is building a case. Not against the girl. Against you.', 'He is enjoying this. He is looking at your mouth while you talk, and you know that look, and it is not the one men usually give you.'),
    'Behind him, his men are already going door to door. The bakery is three doors from the inn.'
  ].filter(Boolean),
  choices: [
    { t:'Lie. Smoothly. The girl ran off to Oxenfurt a week ago.', do:()=>{S.f.q3lied=1;}, out:()=>['He nods as if he believes you. He writes it down. He does not believe you.'], next:'q3search' },
    { t:'Bribe him. Fifty crowns for a letter that says Greyhollow is clean.', if:()=>S.coin>=50, do:()=>{S.coin-=50;S.f.q3bribed=1;S.eye=Math.max(0,S.eye-1);}, out:()=>['He takes it without looking at it. "The Fire is grateful for your donation."','He does not call off the search. He just stops looking at you while it happens. The eye on you softens, slightly.'], next:'q3search' },
    { t:'Hex him. Make him forget the girl’s name.', who:'s', do:()=>{S.f.q3hexed=1;S.eye+=3;}, out:()=>['You touch his wrist like you are flirting and take the name out of his head.','It works. He stands there blinking. His two men saw your hand glow. The Fire’s eye on you is wide open now.','His men do not need the name. They have the bakery.'], next:'q3search' },
    { t:'Let him see your eyes. Remind him what a witcher does to men who threaten him.', who:'w', do:()=>{S.f.q3scared=1;S.eye+=1;}, out:()=>['His men step back. He does not, but his hand finds his medallion.','You have bought silence, not safety. He will write to Oxenfurt tonight.'], next:'q3search' },
    { t:'Answer every question with a question. Where is his warrant? Who signed it? Does Oxenfurt know he is here?', do:()=>{S.f.q3stalled=1;}, out:()=>['He has a warrant. It is signed by himself. Oxenfurt does not, in fact, know he is here; he came on a clerk’s letter, not an order.','You have learned something. He has learned you noticed.'], next:'q3search' }
  ]
};
N.q3search = {
  q:'q3', where:'The Drowned Rat, dusk', title:'The search',
  text: () => {
    const l = S.f.liesl;
    const t = ['Four of Rook’s men come through the inn at dusk with torches and a dog. They are not subtle. They turn over the beds, they open the flour barrels, they put a boot through Berna’s cellar door.'];
    if (S.f.q3ansel) t.push('Father Ansel is with them, as the town’s priest, and Father Ansel is being extraordinarily slow. He has lost his keys. He has found his keys. He needs to bless the cellar before anyone enters it. Nobody can tell if he is a coward or a hero and he seems unsure himself.');
    if (l==='hidden') t.push('One of them stops at the hearth and looks up. The dog is looking up too. Pip is up there with Liesl, and Pip is a nature spirit, not a soldier.');
    if (l==='trained') t.push('Liesl is in the back room, sitting at the table with her hands folded, three candles in front of her, none of them lit. A man asks her name. She tells him. A man asks if she is afraid. "No," she says, and nothing on the table moves.');
    if (l==='coached') t.push('Liesl is in the back room, sitting at the table with her hands folded. A man asks her name. She tells him the boring story you gave her, in the boring voice. Then Rook comes in, pulls a chair up close, and asks her what her mother’s name was.');
    if (l==='marga'||l==='hag') t.push('She is not here and they know it. So they take Matthis instead. Two men walk the baker out of his own shop in irons. "Bait," Rook says, pleasantly, to the street. "Children come home for their fathers."');
    return t;
  },
  choices: [
    { t:'Let Pip handle it. Godlings are good at being somewhere else.', if:()=>S.f.liesl==='hidden', do:()=>{S.f.q3pip=1;}, out:()=>['Every pot in the kitchen falls off its hook at once. The dog bolts. The torches gutter. A voice from the rafters says "BOO" in a tone of enormous satisfaction.','The soldier at the hearth decides the chimney is a problem for the morning. There will not be a morning for this. Pip has never been prouder.'], next:'q3night' },
    { t:()=>R('Axii the man at the hearth. He has seen nothing.','Glamour the hearth. Stone, soot, no ladder, no girl.'), if:()=>S.f.liesl==='hidden', do:()=>{S.eye+= W()?1:2;}, out:()=>W()?['He blinks, nods, and walks out. The dog does not nod. The dog keeps looking up, and one of the other men notices the dog.','It holds. Barely. Someone will mention the dog to Rook.']:['The hearth is a hearth. The dog whines at nothing and is kicked for it.','It holds. The man who was kicked for his dog will mention the woman by the fire whose shadow fell the wrong way.'], next:'q3night' },
    { t:'Do nothing. Trust the hiding place.', if:()=>S.f.liesl==='hidden', do:()=>{S.f.liesl='taken';S.trust-=1;}, out:()=>['He puts the torch up the flue. Liesl screams. They have her out and in the cage inside a minute, and Pip is a smear of soot on the hearthstone, crying.','The town watched you stand there. Trust drops.'], next:'q3night' },
    { t:'Stand behind her and say nothing.', if:()=>S.f.liesl==='trained', do:()=>{S.trust+=1;}, out:()=>['They search the room around her and leave. Rook looks at the three unlit candles for a long moment and then at you.','She did that. You taught her to. The town saw a baker’s girl stare down the Fire and Greyhollow is quietly thrilled.'], next:'q3night' },
    { t:'Get her out the back before they reach the room. Do not make her test it.', if:()=>S.f.liesl==='trained', do:()=>{S.eye+=1;}, out:()=>['She goes over the yard wall. The dog goes after her. Halfway down the lane the dog’s tail catches fire, just the tail, just for a second, and the dog goes home.','They lose her. They also now know exactly what they are looking for, and that it has been taught. The Fire’s eye on you grows.'], next:'q3night' },
    { t:'Answer for her. "Her mother was Hanna. Died of the flux. Anything else?"', if:()=>S.f.liesl==='coached', do:()=>{S.f.q3answered=1;}, out:()=>['Rook does not look at you. He keeps looking at Liesl, who has gone white. "I asked her," he says. Then, lightly: "Hanna. I will remember that."','They leave. It held. Rook now has a name he can check, and a girl whose face told him everything.'], next:'q3night' },
    { t:'Let her answer.', if:()=>S.f.liesl==='coached', do:()=>{S.f.liesl='taken';S.trust-=1;}, out:()=>['"Hanna," Liesl says, and the candle on the table goes up like a torch.','Rook smiles for the first time since he rode in. The cage door closes. Trust drops.'], next:'q3night' },
    { t:'Let them take Matthis. She is safe where she is.', if:()=>S.f.liesl==='marga'||S.f.liesl==='hag', do:()=>{S.f.matthis='taken';S.trust-=2;}, out:()=>['The street watches a baker go into a cage for a daughter who is miles away. Nobody says your name. Nobody has to.','Trust drops hard. Liesl will hear about this wherever she is.'], next:'q3night' },
    { t:'Stop them. Nobody takes the baker.', if:()=>S.f.liesl==='marga'||S.f.liesl==='hag', do:()=>{S.f.q3stopped=1;S.trust+=2;S.eye+=1;}, out:()=>W()?['You take the irons off him with your hands. The two men decide they have other errands.','The street cheers. Rook, from the chapel steps, writes it down.']:['You do not touch anyone. You say "Let him go," and the irons open on their own, and every man on the street sees them open.','The street cheers. Rook, from the chapel steps, writes it down.'], next:'q3night' }
  ]
};
N.q3night = {
  q:'q3', where:'The Drowned Rat, midnight', title:'The knock',
  text: () => {
    const raid = !!(S.f.q3hexed || S.eye>=5 || S.f.q3scared || S.f.q3stopped || S.f.q3spoke);
    S.f.q3raid = raid ? 1 : 0;
    if (raid) return [
      'They come at midnight. Rook and all six, torches, the cage on wheels, a warrant he wrote himself. Someone told him where you sleep. Pip says the alderman did, and Pip is usually right about who smells of guilt.',
      S.f.liesl==='taken' || S.f.matthis==='taken' ? 'They already have their prisoner in the cage outside. They are here for you.' : 'They are not here for Liesl first. They are here for you.',
      S.f.q3stalled ? 'You know something they do not: Oxenfurt never sent him. Whatever happens tonight, there is no one behind him. Yet.' : ''
    ].filter(Boolean);
    return [
      'Nothing comes at midnight. Rook has what he came for, or has decided this town is not worth a fourth day.',
      S.f.liesl==='taken' ? 'Liesl is in the cage in the square. Rook leaves at first light for Oxenfurt, and in Oxenfurt there is a pyre with room on it.' :
      S.f.matthis==='taken' ? 'Matthis is in the cage in the square. Rook leaves at first light for Oxenfurt, and the baker is going with him as a lesson.' :
      S.f.q3hoddYes ? 'The tinker is in the cage in the square. He has stopped shouting. Rook leaves at first light with a man who did nothing, and the town watches him go and then looks at you.' :
      S.f.q3hoddDren ? 'Dren is in the cage in the square. Father Ansel sat beside it all night. Rook leaves at first light with his own clerk in irons and a face that says this is not the trip he wanted.' :
      'Rook leaves at first light with an empty cage and a letter he will send from Oxenfurt with your name in it.'
    ];
  },
  choices: [
    { t:'Fight through them.', if:()=>S.f.q3raid, do:()=>{S.f.rook='dead';S.trust-=1;S.eye+=2; if(S.f.liesl==='taken') S.f.liesl='hidden'; if(S.f.matthis==='taken') S.f.matthis='freed';}, out:()=>W()?['Six men with torches against a witcher in a doorway. It is not a fight, it is a lesson. Rook dies last, on the steps, surprised.','You break the cage open with a pommel. Oxenfurt will hear a captain of the Order died in Greyhollow, and the next letter will be a column.']:['You let them see you. Properly. The glamour comes off and the room fills with a light that is not fire, and six men learn what the Order has been burning women to avoid.','Rook dies with his medallion in his fist. The cage opens on its own. Oxenfurt will hear, and the next letter will be a column.'], next:'q3end' },
    { t:'Run. Out the back, into the dark.', if:()=>S.f.q3raid, do:()=>{S.f.rook='alive';S.trust-=2; if(S.f.liesl==='hidden' && !S.f.q3pip) S.f.liesl='taken';}, out:()=>['You are gone before the door breaks. You are good at this.',(S.f.liesl==='taken')?'They search the inn properly this time. Liesl is in the cage by dawn.':(S.f.liesl==='hidden'?'Pip drops every pot in the kitchen again. It works again. Liesl stays up the chimney, shaking.':'They search the inn and leave with nothing but the alderman’s goodwill.'),'Rook writes to Oxenfurt with your name in it. Trust drops.'], next:'q3end' },
    { t:'Walk out the front door and make him explain, to the whole street, why six armed men need a cage for a baker’s child.', if:()=>S.f.q3raid, do:()=>{S.f.rook='shamed';S.trust+=2; if(S.f.liesl==='taken') S.f.liesl='hidden'; if(S.f.matthis==='taken') S.f.matthis='freed';}, out:()=>['It works because the town is already outside, holding lanterns, and because Rook, for all his sermons, has never once been asked a question by a crowd.',S.f.q3stalled?'You ask the question that matters: "Who sent you?" He has no answer the street will accept.':'','Berna opens the cage herself. Rook leaves at dawn with it empty and a face like a slapped priest.',(S.f.liesl==='hidden')?'Liesl climbs down from the chimney covered in soot and bows. The town laughs. Rook hears it from the road.':'','He will not forget this. Trust rises.'].filter(Boolean), next:'q3end' },
    { t:'Break the cage before dawn. Quietly.', if:()=>!S.f.q3raid && (S.f.liesl==='taken'||S.f.matthis==='taken'||S.f.q3hoddYes||S.f.q3hoddDren), do:()=>{S.f.rook='alive';S.eye+=1; if(S.f.liesl==='taken') S.f.liesl='hidden'; if(S.f.matthis==='taken') S.f.matthis='freed'; if(S.f.q3hoddYes) S.f.tinkerFreed=1; if(S.f.q3hoddDren) S.f.drenFreed=1;}, out:()=>W()?['One sleeping guard, one Axii, one bent bar. Whoever was in the cage is back in the inn before the chapel bell.','Rook wakes to an empty cage and knows exactly who did it. He leaves anyway. He has a column to ask for.']:['One sleeping guard, one whispered word, one lock that decides it was never a lock. Whoever was in the cage is back in the inn before the chapel bell.','Rook wakes to an empty cage and knows exactly who did it. He leaves anyway. He has a column to ask for.'], next:'q3end' },
    { t:'Let him go.', if:()=>!S.f.q3raid, do:()=>{S.f.rook='alive';}, out:()=>[(S.f.liesl==='taken')?'The cage rolls out at dawn with Liesl in it. Matthis runs after it to the bridge and stops there.':(S.f.matthis==='taken')?'The cage rolls out at dawn with Matthis in it. The bakery does not open again.':(S.f.q3hoddYes)?'The cage rolls out at dawn with a tinker in it. You will not learn his name. Nobody will.':(S.f.q3hoddDren)?'The cage rolls out at dawn with Dren in it. Father Ansel walks beside it to the bridge, praying, and then walks back alone.':'He goes. For now. Your name goes with him.'], next:'q3end' }

};

// ===================== QUEST 4: OLD WOOD =====================
N.q4a = {
  q:'q4', where:'The forest road north', title:'Old wood',
  text: () => [
    'Two petitions reach the inn the same morning. Aldo, foreman of the woodcutters’ guild, will pay a hundred and twenty crowns for the leshen in the north wood: three men dead, the rest refusing to go in. A leshen is an ancient forest spirit, antlered and tree-tall, that commands the wolves and crows and treats the wood as its own. Elder Hesper of Thornwick, the village at the wood’s edge that still keeps the old gods, will pay nothing and asks you, please, to leave the forest its master.',
    'The leshen has marked someone. Thornwick will not say who. The woodcutters do not care who.',
    R('Leshens are not killed, they are unmade. Totems first, then the thing itself, and even then they come back if the wood wants them to.',
