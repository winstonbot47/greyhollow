  ],
  choices: [
    { t:'Take Aldo’s coin and go in.', do:()=>{S.f.q4side='aldo';S.coin+=60;}, out:()=>['A hundred and twenty crowns, half now. Aldo says the forest is lumber. He says it like a man who has never been in it at night.'], next:'q4camp' },
    { t:'Go in for Thornwick. See what the forest wants.', do:()=>{S.f.q4side='thornwick';}, out:()=>['Hesper gives you a strip of red cloth to tie on your arm. "So it knows you came as a guest."'], next:'q4camp' }
  ]
};
N.q4camp = {
  q:'q4', where:'The woodcutters’ camp', title:'Three dead men',
  text: () => [
    'The guild camp is at the treeline: a dozen tents, a saw pit, and three graves with fresh dirt. Aldo says the leshen took them. The men who were there say less. One of them, a boy called Wat, will not look at Aldo when he says it.',
    R('You read the ground around the graves. Wolf tracks, yes. Crows, yes. And one set of boot prints walking away from the third grave that match the boots Aldo is wearing.',
      'You put your hand on the third grave and the dead man tells you, without words, in the way the dead do: not wolves. A falling tree. Aldo had them cutting a totem oak, the one tree in the wood you do not cut, and it fell the wrong way, and then the wolves came for the other two because of what they had done.'),
    'Aldo did not mention the oak.'
  ],
  choices: [
    { t:'Say nothing. The contract is the contract.', out:()=>['You let Aldo keep his story. Wat watches you decide to.'], next:'q4forest' },
    { t:'Ask Aldo about the oak. In front of his men.', do:()=>{S.f.q4aldoExposed=1;}, out:()=>['He goes red, then white. The men go quiet. He says the oak was in the way. He says it twice.','Half the camp walks out that afternoon. The ones who stay are the ones who need the money more than they fear the wood. Aldo will not forget you did this.'], next:'q4forest' },
    { t:'Take Wat aside. What does he know?', do:()=>{S.f.q4wat=1;}, out:()=>['Wat is sixteen and has been sick with it for a week. The oak, the fall, the wolves. And one more thing: the night after, he saw the leshen at the treeline, and it looked at him, and he felt it decide he was not the one. "It was looking for someone," he says. "Not me."','He gives you a carved bead he found at the base of the oak. Thornwick work. A girl’s.'], next:'q4forest' }
  ]
};
N.q4forest = {
  q:'q4', where:'The north wood', title:'Guests and trespassers',
  text: () => [
    R('Wolves first. They do not attack. They walk beside you, three on each side, like an escort, or a guard. Your medallion has not stopped humming since the treeline. The totems are everywhere: antlers, bone, red string.',
      'The forest speaks to you before you are a hundred yards in. Not words. Pressure. A door opening in your chest. It knows what you are and it is pleased, the way a king is pleased when another king visits.'),
    S.f.q4side==='thornwick' ? 'The red cloth on your arm is doing something. The wolves keep their distance. The crows watch and do not call.' : 'You came in on Aldo’s coin, with no cloth on your arm, and the wood knows it. The wolves are closer than you would like.',
    'Ahead, at a fork in the path, is a totem taller than the others, hung with a fresh deer skull. The path to the left goes to Thornwick’s side of the wood. The path to the right goes deeper, toward where the trees stop making sense.'

  choices: [

    { t:'Leave it. Walk the left path, toward Thornwick.', out:()=>['The wolves peel off at the edge of the village fields. One of them looks back at you, which wolves do not do.'], next:'q4ysolde' },
    { t:'Walk the right path. Straight at it.', do:()=>{S.f.q4direct=1;}, out:()=>['The trees get older and the light gets wrong. The wolves stop at an invisible line and sit down, all six, and watch you cross it.'], next:'q4ysolde' }
  ]
};
N.q4ysolde = {
  q:'q4', where:'A clearing by Thornwick’s well', title:'The marked one',
  text: () => [
    'You find the mark on a tree by Thornwick’s well: a name cut in Elder runes. Ysolde. Hesper’s granddaughter. Sixteen.',
    S.f.q4wat ? 'The bead Wat gave you is hers. She was at the oak the night it fell. She was there to stop them.' : '',
    'She is at the well, drawing water, and she has known for a week. She asks you not to tell her grandmother. "Gran will try to give herself instead. The wood won’t take her. It wants someone who still has years."',
    'A marked one is the leshen’s tithe. While she lives, the forest is fed and quiet. If you kill the marked one, the leshen loses its anchor and can be destroyed. If the leshen is destroyed with the mark intact, the mark passes to whoever killed it.',

  ].filter(Boolean),
  choices: [
    { t:'Promise her you will not tell Hesper.', do:()=>{S.f.q4promise=1;}, out:()=>['She breathes out. "Thank you." She goes back to drawing water, because the goats still need it, marked or not.'], next:'q4thornwick' },
    { t:'Tell her you make no promises until you have seen the thing.', out:()=>['She nods. "Fair." She is braver than most of the men you have met this month.'], next:'q4thornwick' },
    { t:'Tell her the truth: the cleanest way out of this is her.', do:()=>{S.f.q4toldYsolde=1;}, out:()=>['She does not flinch. "I know. I’ve known for a week. If it comes to that, do it at the well, at night, and don’t let Gran find me."','You have never been given permission for something like that before. It does not make it easier.'], next:'q4thornwick' }
  ]
};

// ===================== QUEST 5: LONG SHADOWS =====================
function defense(){
  let d = 0; const why = [];
  if (S.f.troll==='keeper'){ d+=2; why.push('Bogdan holds the bridge.'); }
  if (S.f.elves==='saved' && S.f.elfSignal && S.f.q5signal){ d+=2; why.push('Elven arrows from the north bank, because you lit the fire.'); }
  else if (S.f.elves==='saved'){ d+=1; why.push('A few elven arrows from the north bank.'); }
  if (S.f.lukas==='owes'){ d+=1; why.push('Lukas and the Ashbrook bows.'); }
  if (S.f.childSaved){ d+=1; why.push('Ida and half of Ashbrook, with pitchforks, because of Tam.'); }
  if (S.f.liesl==='trained'){ d+=2; why.push('Liesl.'); }
  if (S.f.liesl==='hag'){ d+=2; why.push('Auntie Yew, and what Liesl became.'); }
  if (S.f.leshen==='pact'||S.f.leshen==='fed'||S.f.leshen==='alive'||S.f.leshen==='treaty'){ d+=1; why.push('The forest eats what runs into it.'); }
  if (S.f.wraith==='river'){ d+=1; why.push('Something in the river remembers.'); }
  if (S.f.scouts==='lied'){ d+=1; why.push('Nilfgaard came slow, expecting crossbows.'); }
  if (S.f.scouts==='told'){ d-=1; why.push('Nilfgaard came fast. You told them what was here.'); }
  if (S.f.sergeantFriend){ d+=1; why.push('A Redanian sergeant who owes you looked the other way at the right moment.'); }
  if (S.trust>=6){ d+=1; why.push('The town fights for you.'); }
  if (S.trust<=1){ d-=1; why.push('The town will not fight beside you.'); }
  return {d, why};
}
N.q5a = {

    S.f.rook==='dead' ? 'Behind the column, under the Eternal Fire’s banner, is the rest of Rook’s order. Thirty men with torches, here for whoever killed a captain. They have an understanding with the Nilfgaardians: the town is theirs to burn, you are the Fire’s to keep.' :
    S.f.rook==='alive' && S.eye>=6 ? 'Rook is with them. Of course he is. He has a warrant with your name on it and a column to enforce it.' :
    S.f.rook==='shamed' ? 'Rook is with them, at the back, with a face that has been waiting for this.' : '',
    '<pip>Pip: "Bridge first. Everything else is after."</pip>'
  ].filter(Boolean),
  choices: [

    { t:'The bridge. Now.', out:()=>['You run.'], next:'q5bridge' }
  ]
};
N.q5bridge = {
  q:'q5', where:'The stone bridge', title:'Hold or burn',
  text: () => {
    const t = [];

function esc(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function para(p){
  if (p.startsWith('<pip>')) { let t = p.slice(5,-6); t = t.replace(/^Pip,? (the godling from the inn chimney, )?(from (inside )?your (coat|pocket)|quietly|in your pocket)?:?\s*/i,''); return `<div class="pip"><span class="pl">Pip, from your pocket</span>${esc(t)}</div>`; }
  if (p.startsWith('<h>')) { const i = p.indexOf('</h>'); return `<p><b class="lore">${esc(p.slice(3,i))}</b> ${esc(p.slice(i+4))}</p>`; }
  return `<p>${esc(p)}</p>`;
}

function renderStatus(){
  const el = document.getElementById('status');
  if (!S.role){ el.innerHTML=''; return; }
  el.innerHTML = `<span><b>${NAME()}</b></span><span class="trust">Trust <b>${S.trust}</b></span><span class="eye">The Fire’s eye <b>${S.eye}</b></span><span class="coin">Crowns <b>${S.coin}</b></span>`;
}

function render(){
  clamp(); save(); renderStatus();
  const n = N[S.node]; const main = document.getElementById('main');
  let h = `<section class="scene"><p class="eyebrow">${esc(n.where)}</p><h2>${esc(n.title)}</h2>`;
  const qd = n.q && QUESTS.find(q=>q.id===n.q);
  if (qd && qd.start===S.node && qd.brief){
    h += `<div class="card"><span><b>Where</b>${esc(qd.brief.where)}</span><span><b>Who</b>${esc(qd.brief.who)}</span><span><b>At stake</b>${esc(qd.brief.stake)}</span></div>`;
  } else if (n.cast || CAST[S.node]) {
    const c = (n.cast ? n.cast() : CAST[S.node]);
    h += `<div class="card"><span><b>Who is here</b>${esc(c.join(' · '))}</span></div>`;
  }
  (n.text ? n.text() : []).filter(Boolean).forEach(p => h += para(p));
  if (n.pick){
    h += `<div class="pick">
      <button data-role="witcher"><span class="nm w">Garrick of Ard Carraigh</span><span class="ds">Witcher, School of the Griffin. Two swords, five Signs, a medallion that hums near monsters, and a face people stop trusting the moment they see the eyes. Good at killing things. Trying to be good at the other part.</span></button>
      <button data-role="witch"><span class="nm s">Ilvara of Aretuza</span><span class="ds">Sorceress. Lodge-trained, court-polished, and hunted now that Redania burns her kind. Raw Chaos under a glamour so good you forget she is wearing one. Beautiful on purpose, dangerous by nature. Every spell she casts in public is a step closer to a pyre.</span></button>
    </div>`;
  } else if (n.hub){
    h += `<ul class="board">`;
    QUESTS.forEach(q => {
      const done = !!S.done[q.id];
      const early = q.gate && Object.keys(S.done).filter(k=>k!=='q5').length < q.gate;
      h += `<li class="${done?'done':''}"><button data-q="${q.id}"><span class="qn">${esc(q.name)}</span><span class="qs">${done ? 'Finished. Play again to change it.' : early ? 'Best after the other four. Counts whatever you have done.' : esc(q.blurb)}</span></button></li>`;
    });
    h += `</ul>`;
  } else if (n.end){
    if (n.ledger) h += ledgerHTML();
    h += `<div class="next"><button class="btn" id="go">Back to the Drowned Rat</button></div>`;
  } else if (S.chosen === null){
    const cs = visibleChoices(n);
    h += `<p class="prompt">&gt; What do you do?</p><ul class="choices">`;
    cs.forEach((c,i) => {
      const who = c.who ? `<span class="who">${c.who==='w'?'Witcher':'Sorceress'} only</span>` : '';
      const label = typeof c.t === 'function' ? c.t() : c.t;
      h += `<li><button data-i="${c._i}" class="${c.who==='w'?'w':''}" ${c.disabled?'disabled':''}><span class="key">[${i+1}]</span><span>${esc(label)}${who}</span></button></li>`;
    });
    h += `</ul>`;
  } else {
    const c = n.choices[S.chosen];
    h += `<p class="prompt">&gt; ${esc(typeof c.t === 'function' ? c.t() : c.t)}</p>`;
    const out = (c.out ? c.out() : []).filter(Boolean);
    if (out.length){ h += `<div class="result"><h3>What happens</h3><ul>`; out.forEach(o => h += `<li>${esc(o)}</li>`); h += `</ul></div>`; }
    if (S._delta) h += `<p class="delta">${esc(S._delta)}</p>`;
    h += `<div class="next"><button class="btn" id="go">Continue</button></div>`;
  }
  h += `</section>`;
  main.innerHTML = h;
  main.querySelectorAll('button[data-role]').forEach(b => b.addEventListener('click', () => { S.role = b.dataset.role; S.eye = W() ? 1 : 2; S.node='prologue'; render(); }));

  } else {

  }

function visibleChoices(n){
  return n.choices.map((c,i)=>Object.assign({_i:i},c)).filter(c => (!c.who || (c.who==='w')===W()) && (!c.if || c.if()));

function startQuest(id){
  const q = QUESTS.find(x=>x.id===id);
  // reset this quest's flags so replays are clean
  const keep = {};
  Object.keys(S.f).forEach(k => { if (!k.startsWith(id)) keep[k]=S.f[k]; });
  if (id==='q1'){ ['wraith','lukas','marga','margaSafe','margaWitness','margaCharm','bribe','refused','bertKnows','childSaved','letterSent','letterKept','lukasTold','lukasConfess'].forEach(k=>delete keep[k]); }
  if (id==='q2'){ ['troll','elves','trollFriend','trollTruth','trollScared','scouts','elfSignal','sergeantFriend'].forEach(k=>delete keep[k]); }
  if (id==='q3'){ ['liesl','rook','matthis','tinkerFreed','drenFreed'].forEach(k=>delete keep[k]); }
  if (id==='q4'){ ['leshen','ysolde','marked','aldo'].forEach(k=>delete keep[k]); }
  if (id==='q5'){ ['held','burned','trollDiedBridge'].forEach(k=>delete keep[k]); if(keep.liesl==='saved') keep.liesl='taken'; }
  S.f = keep; S.node = q.start; S.chosen = null; render();
}
function choose(i){
  const n = N[S.node]; const c = n.choices[i];
  const before = {trust:S.trust, eye:S.eye, coin:S.coin};
  if (c.do) c.do();
  clamp();
  const d = [];
  if (S.trust!==before.trust) d.push(`Trust ${S.trust>before.trust?'+':''}${S.trust-before.trust}`);
  if (S.eye!==before.eye) d.push(`Fire’s eye ${S.eye>before.eye?'+':''}${S.eye-before.eye}`);
  if (S.coin!==before.coin) d.push(`Crowns ${S.coin>before.coin?'+':''}${S.coin-before.coin}`);
  S._delta = d.join(' · ');
  S.log.push({node:S.node, pick:typeof c.t === 'function' ? c.t() : c.t});
  const out = (c.out ? c.out() : []).filter(Boolean);
  if (!out.length && !S._delta){ S.node = nextOf(c); S.chosen=null; render(); return; }
  S.chosen = i; render();
}
function nextOf(c){ return typeof c.next === 'function' ? c.next() : c.next; }
function advance(){
  const n = N[S.node];
  if (n.end){ S.done[n.q] = 1; S.node='hub'; S.chosen=null; S._delta=''; render(); return; }
  const c = n.choices[S.chosen]; S.node = nextOf(c); S.chosen = null; S._delta=''; render();
}

  const you = S.f.q5exposed ? [R('Free. Rook is finished, and the town knows what the Fire is.', 'Free, and famous in the wrong circles. Rook is finished, and the town knows what the Fire is.'), 'good']
    : (S.f.rook==='dead' || S.eye>=7) ? [R('Leaving by the north road, hunted by the Order.', 'Leaving by the north road, hunted by the Order, with your real face in Rook’s memory.'), 'bad']
    : [R('Free to ride on. Greyhollow will tell stories about the witcher.', 'Free to ride on, glamour intact. Greyhollow will tell stories about the beautiful stranger and get all the details wrong.'), 'good'];
  const rows = [

    ['Matthis the baker', S.f.matthis==='taken' ? ['Taken to Oxenfurt as bait. Did not come back.','bad'] : S.f.matthis==='freed' ? ['Pulled out of the cage. Baking again.','good'] : S.done.q3 ? ['Alive. Bread still a little burnt.',''] : ['Never met him.','']],
    ['Marga', S.f.marga==='gone' ? ['House burned. Gone.','bad'] : S.done.q1 ? ['Alive. Chickens intact.','good'] : ['Never met her.','']],
    ['Lukas', S.f.lukas==='hanged' ? ['Hanged by his father.','bad'] : S.f.lukas==='owes' ? ['Alive. Paid his debt on the bridge.','good'] : S.f.lukas==='exiled' ? ['On the north road with a bow. In someone’s army by now.',''] : S.f.lukas==='dead' ? ['In the well with the man he put there.','bad'] : S.f.lukas==='free' ? ['Got away with it.','bad'] : ['Never met him.','']],
    ['Tam and Ida', S.f.childSaved ? ['Tam alive. Ida brought Ashbrook to the bridge.','good'] : S.f.q1passedChild ? ['Tam lived. Ida remembers you walked past.','bad'] : S.done.q1 ? ['Tam mending.',''] : ['Never met them.','']],
    ['Aurelio', S.f.wraith==='rested' ? ['Went home.' + (S.f.letterSent ? ' His brother pulled forty men off the bridge for it.' : ''),'good'] : S.f.wraith==='destroyed' ? ['Destroyed.',''] : S.f.wraith==='river' ? ['In the river. Took a rank of Nilfgaardians with him.',''] : S.f.wraith==='fed' ? ['Took Lukas. Satisfied.','bad'] : ['Never met him.','']],
    ['Bogdan’s secret', S.f.q2riddle ? ['You knew the garrison was bought. You knew who was coming.','good'] : S.done.q2 ? ['Never asked. The empty bridge was a surprise.',''] : ['','']],
    ['The north wood', S.f.leshen==='pact' ? ['Fed on white cloaks. Promise kept.','good'] : S.f.leshen==='treaty' ? ['A new bargain. Nobody died. Ysolde is sixteen.','good'] : S.f.leshen==='fed' ? ['Fed on Aldo. Quiet.',''] : S.f.leshen==='alive' ? ['Alive. Ysolde still marked.',''] : S.f.leshen==='dead' && S.f.marked ? ['Dead. The mark is in you.','bad'] : S.f.leshen==='dead' ? ['Dead. Ysolde dead. Just trees.','bad'] : ['Never went in.','']]
  ];
  let h = `<p>Greyhollow’s defense came to <b>${d}</b>. ${why.length ? 'What counted: ' + why.join(' ') : 'Nothing you did came back to help.'}</p>
  <div class="tablewrap"><table><thead><tr><th>Who</th><th>Where they ended up</th></tr></thead><tbody>`;
  rows.forEach(r => h += `<tr><td>${esc(r[0])}</td><td class="${r[2]||''}">${esc(r[1])}</td></tr>`);
  h += `</tbody></table></div>
  <div class="result"><h3>The argument</h3>
  <p>Count the rows that turned on something small. A true story told to a troll. A purse left on a table. Which hut you walked to first. None of it looked like the big choice when you made it.</p>
  <p>Now play it as the other one. ${W() ? 'Ilvara can do things Garrick cannot, and every one of them is seen.' : 'Garrick cannot do half of what you did, and nobody writes to Oxenfurt about him.'}</p></div>`;
  return h;
}

<script id="narr-text">
// Narration text for Winston's voice. Pure: reads S, N, QUESTS and the page's own
// para()/visibleChoices(), never writes state. build_narration.py runs this exact
// block (with the game script above) in Node to learn what to pre-render, so the
// clips the page asks for and the clips on disk come from one definition.
const NARR_NUM = ['One','Two','Three','Four','Five','Six','Seven','Eight','Nine'];
function narrPara(p){
  // reuse the page's renderer, then flatten its HTML to the words on screen
  return para(p).replace(/<span class="pl">(.*?)<\/span>/, '$1: ').replace(/<[^>]+>/g, ' ')
    .replace(/&lt;/g, '<').replace(/&amp;/g, '&');
}
function narrClips(){
  const n = N[S.node]; if (!n) return [];
  const L = c => typeof c.t === 'function' ? c.t() : c.t;
  const clips = [];
  const add = (id, text) => { text = String(text == null ? '' : text).replace(/\s+/g, ' ').trim(); if (text) clips.push({id, text}); };
  if (S.chosen !== null && !n.end && n.choices && n.choices[S.chosen]) {
    const c = n.choices[S.chosen];
    add(`outcome:${S.node}:${S.chosen}:pick`, L(c));
    (c.out ? c.out() : []).filter(Boolean).forEach((o, k) => add(`outcome:${S.node}:${S.chosen}:${k}`, o));
    return clips;
  }
  add(`scene:${S.node}:title`, n.title);
  (n.text ? n.text() : []).filter(Boolean).forEach((p, k) => add(`scene:${S.node}:${k}`, narrPara(p)));
  let opts = [];
  if (n.pick) opts = ['Garrick of Ard Carraigh, the witcher.', 'Ilvara of Aretuza, the sorceress.'];
  else if (n.hub) opts = QUESTS.map(q => q.name + '.');
  else if (!n.end && n.choices) { opts = visibleChoices(n).map(L); if (opts.length) add('ask', 'What do you do?'); }
  opts.forEach((t, i) => add(`choice:${S.node}:${i}`, `${NARR_NUM[i] || (i + 1)}: ${t}`));
  return clips;
}
// v2 narration (10/19): whole-scene clips on eleven_v3, rendered on demand by ARC and cached there.
// The clips above stay the units (and the v1 fallback files); narrParts() joins them into the clips ARC
// renders. Clip id = sha1(model|voice|settings|text)[:16]; build_narration.py asserts Python agrees.
const NARR_V3 = { model: 'eleven_v3', voice: 'NFG5qt843uXKj4pFvR7C',
  settings: 'stability=0.5,similarity_boost=0.75,style=0.3,speed=1.0,use_speaker_boost=true,output_format=mp3_44100_128' };
const NARR_MAX = 4500;   // characters per ElevenLabs request; a longer scene splits at a paragraph boundary
function narrParts(){
  const clips = narrClips(); if (!clips.length) return [];
  const n = N[S.node];
  const kind = clips[0].id.startsWith('outcome:') ? 'outcome' : n.hub ? 'hub' : n.pick ? 'role' : 'scene';
  const isOpt = c => c.id === 'ask' || c.id.startsWith('choice:');
  // v3 audio tags as in the approved test (audio-test/v3_scene.txt): [short pause] between units,
  // [long pause] before "What do you do?" (or before the list on the hub and role screens)
  const seg = clips.map((c, i) => {
    let t = c.text;
    if (c.id.endsWith(':title') && !/[.!?…]$/.test(t)) t += '.';
    const long = i > 0 && isOpt(c) && !isOpt(clips[i - 1]);
    return { t, sep: long ? ' [long pause] ' : ' [short pause] ', sub: c };
  });
  const groups = []; let cur = null;
  seg.forEach(g => {
    if (cur && cur.text.length + g.sep.length + g.t.length > NARR_MAX) cur = null;
    if (!cur) { cur = { text: g.t, subs: [g.sub] }; groups.push(cur); }
    else { cur.text += g.sep + g.t; cur.subs.push(g.sub); }
  });
  return groups.map((g, k) => ({ id: narrSha1(`${NARR_V3.model}|${NARR_V3.voice}|${NARR_V3.settings}|${g.text}`).slice(0, 16),
    kind, scene: S.node, part: k + 1, of: groups.length, text: g.text, subs: g.subs }));
}
// SHA-1 hex of the UTF-8 text; the build names each MP3 sha1(text)[:16]
function narrSha1(str){
  const b = new TextEncoder().encode(str), l = b.length, nw = (((l + 8) >> 6) + 1) * 16, w = new Uint32Array(nw), x = new Uint32Array(80);
  for (let i = 0; i < l; i++) w[i >> 2] |= b[i] << (24 - (i & 3) * 8);
  w[l >> 2] |= 0x80 << (24 - (l & 3) * 8); w[nw - 1] = l * 8;
  let h0 = 0x67452301, h1 = 0xEFCDAB89, h2 = 0x98BADCFE, h3 = 0x10325476, h4 = 0xC3D2E1F0;
  for (let i = 0; i < nw; i += 16) {
    for (let t = 0; t < 16; t++) x[t] = w[i + t];
    for (let t = 16; t < 80; t++) { const v = x[t-3] ^ x[t-8] ^ x[t-14] ^ x[t-16]; x[t] = (v << 1) | (v >>> 31); }
    let a = h0, bb = h1, c = h2, d = h3, e = h4;
    for (let t = 0; t < 80; t++) {
      const f = t < 20 ? (bb & c) | (~bb & d) : t < 40 ? bb ^ c ^ d : t < 60 ? (bb & c) | (bb & d) | (c & d) : bb ^ c ^ d;
      const k = t < 20 ? 0x5A827999 : t < 40 ? 0x6ED9EBA1 : t < 60 ? 0x8F1BBCDC : 0xCA62C1D6;
      const tmp = (((a << 5) | (a >>> 27)) + f + e + k + x[t]) >>> 0;
      e = d; d = c; c = ((bb << 30) | (bb >>> 2)) >>> 0; bb = a; a = tmp;
    }
    h0 = (h0 + a) >>> 0; h1 = (h1 + bb) >>> 0; h2 = (h2 + c) >>> 0; h3 = (h3 + d) >>> 0; h4 = (h4 + e) >>> 0;
  }
  return [h0, h1, h2, h3, h4].map(v => v.toString(16).padStart(8, '0')).join('');
}
</script>
<script id="narr-player">
// Winston narration player (v2, 10/19). Each view is one whole-scene clip on eleven_v3 (narrParts), rendered the
// first time anyone asks for it and cached by ARC: GET /api/games/narrate/<id>. ARC only knows the ids in its
// narration.json, so no text ever leaves this page and nobody can spend credits on their own words.
// Per clip: (1) ARC (this origin when the page is served by ARC, else the public ARC host), (2) the v1
// per-paragraph clips in audio/ (manifest.json), (3) the browser's speechSynthesis. No API key here.
(function(){
  const header = document.querySelector('header'); if (!header || typeof narrParts !== 'function') return;
  const hasTTS = 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined';
  const AUTO_KEY = 'greyhollow-autoread';
  const ARC = (/^\/static\/games\//.test(location.pathname) ? location.origin : 'https://winston.tail05945a.ts.net') + '/api/games/narrate/';
  let files = null;            // v1 fallback: hash16 -> file name, from audio/manifest.json
  let arcDownUntil = 0;        // a network failure skips ARC for a minute
  let auto = false; try { auto = localStorage.getItem(AUTO_KEY) === '1'; } catch(e) {}
  let armed = false;           // first user gesture seen (iOS: audio may only start inside one)
  let playing = false, reading = false, token = 0, queue = [], qi = 0, viewKey = '', ctl = null, blobUrl = '';
  const audio = document.createElement('audio'); audio.preload = 'none'; audio.setAttribute('playsinline', '');
  // a tenth of a second of silence, played inside the tap that starts narration, so iOS lets this element
  // play the clip that arrives later (after the fetch, outside the gesture)
  const SILENT = (() => { const n = 800, b = new Uint8Array(44 + n), v = new DataView(b.buffer);
    const w = (o, t) => { for (let i = 0; i < t.length; i++) b[o + i] = t.charCodeAt(i); };
    w(0, 'RIFF'); v.setUint32(4, 36 + n, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true);
    v.setUint16(22, 1, true); v.setUint32(24, 8000, true); v.setUint32(28, 8000, true); v.setUint16(32, 1, true);
    v.setUint16(34, 8, true); w(36, 'data'); v.setUint32(40, n, true); b.fill(128, 44);
    let s = ''; b.forEach(x => { s += String.fromCharCode(x); }); return 'data:audio/wav;base64,' + btoa(s); })();
  const icon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
  const box = document.createElement('div'); box.className = 'narr'; box.hidden = true;
  box.innerHTML = `<button type="button" id="narrPlay" aria-pressed="false" title="Winston reads this scene aloud (N)">${icon}<span>Listen</span></button><button type="button" id="narrAuto" aria-pressed="false" title="Read each new scene as it opens">Auto-read <span>off</span></button>`;
  header.appendChild(box); box.appendChild(audio);
  const bPlay = box.querySelector('#narrPlay'), bAuto = box.querySelector('#narrAuto');
  const api = window.GreyhollowNarration = { last: null, sources: [], arc: null };   // status, for testing

  function paint(){
    bPlay.setAttribute('aria-pressed', playing ? 'true' : 'false');
    bPlay.classList.toggle('reading', reading);
    bPlay.querySelector('span').textContent = reading ? 'Winston is reading…' : playing ? 'Stop' : 'Listen';
    bAuto.setAttribute('aria-pressed', auto ? 'true' : 'false');
    bAuto.querySelector('span').textContent = auto ? 'on' : 'off';
  }
  function clearBlob(){ if (blobUrl) { try { URL.revokeObjectURL(blobUrl); } catch(e) {} blobUrl = ''; } }
  function stop(){
    token++; playing = false; reading = false; queue = []; qi = 0;
    if (ctl) { try { ctl.abort(); } catch(e) {} ctl = null; }
    audio.onended = audio.onerror = null; try { audio.pause(); } catch(e) {}
    clearBlob();
    if (hasTTS) { try { speechSynthesis.cancel(); } catch(e) {} }
    paint();
  }
  function unlock(){
    try { audio.onended = audio.onerror = null; audio.src = SILENT; const p = audio.play(); if (p && p.catch) p.catch(() => {}); } catch(e) {}
  }
  function playSrc(src, my, onFail, label){
    api.sources.push(label); api.last = label.split(':')[0];
    audio.onended = () => { if (my === token) next(my); };
    audio.onerror = () => { if (my === token) { audio.onerror = audio.onended = null; onFail(); } };
    audio.src = src;
    const p = audio.play();
    if (p && p.catch) p.catch(err => { if (my === token && err && err.name !== 'AbortError') { audio.onerror = audio.onended = null; onFail(); } });
  }
  function speak(text, my){
    if (!hasTTS) { next(my); return; }
    api.sources.push('tts'); api.last = 'tts';
    const u = new SpeechSynthesisUtterance(text); u.rate = 1.05;
    u.onend = u.onerror = () => { if (my === token) next(my); };
    speechSynthesis.speak(u);
  }
  function next(my){
    if (my !== token) return;
    if (qi >= queue.length) { playing = false; reading = false; paint(); return; }
    const it = queue[qi++];
    if (it.part) { arcPlay(it.part, my); return; }
    const f = files && files[it.h];                       // v1 clip, else the browser voice
    if (!f) { speak(it.text, my); return; }
    playSrc('audio/' + f, my, () => speak(it.text, my), 'v1:' + f);
  }
  function fallback(part, my){                            // this clip's v1 units, in order
    queue.splice(qi, 0, ...part.subs.map(c => ({ text: c.text, h: narrSha1(c.text).slice(0, 16) })));
    next(my);
  }
  async function arcPlay(part, my){
    if (Date.now() < arcDownUntil) { fallback(part, my); return; }
    const slow = setTimeout(() => { if (my === token) { reading = true; paint(); } }, 350);
    let tries = 0;
    try {
      for (;;) {
        ctl = new AbortController();
        const r = await fetch(ARC + part.id, { signal: ctl.signal });
        if (my !== token) return;
        api.arc = r.status;
        if (r.status === 429 && tries++ < 2) {          // one render at a time on ARC: wait and ask again
          let s = 3; try { s = (await r.json()).retry_s || 3; } catch(e) {}
          await new Promise(z => setTimeout(z, s * 1000));
          if (my !== token) return;
          continue;
        }
        if (!r.ok) throw new Error('arc ' + r.status);   // 404 / 429 again / 503 quota or cap / 5xx
        const b = await r.blob();
        if (my !== token) return;
        clearTimeout(slow); reading = false; clearBlob(); blobUrl = URL.createObjectURL(b); paint();
        playSrc(blobUrl, my, () => fallback(part, my), 'arc:' + part.id);
        return;
      }
    } catch (e) {
      clearTimeout(slow);
      if (my !== token) return;
      if (e && e.name === 'TypeError') arcDownUntil = Date.now() + 60000;   // network: ARC unreachable
      reading = false; paint();
      fallback(part, my);
    }
  }
  function build(){ return narrParts(); }
  function play(){
    stop(); const parts = build(); if (!parts.length) return;
    queue = parts.map(p => ({ part: p })); playing = true; paint(); unlock(); next(token);
  }
  function onView(){
    const key = build().map(p => p.id).join(',');
    if (key === viewKey) return; viewKey = key;
    stop();
    if (auto && armed) play();
  }
  bPlay.addEventListener('click', () => { armed = true; if (playing) stop(); else play(); });
  bAuto.addEventListener('click', () => {
    armed = true; auto = !auto; try { localStorage.setItem(AUTO_KEY, auto ? '1' : '0'); } catch(e) {}
    paint(); if (auto && !playing) play(); else if (!auto) stop();
  });
  ['pointerdown', 'keydown'].forEach(t => document.addEventListener(t, () => { armed = true; }, { capture: true, passive: true }));
  document.addEventListener('keydown', e => {
    if (box.hidden || e.ctrlKey || e.metaKey || e.altKey || (e.key !== 'n' && e.key !== 'N')) return;
    const tag = (e.target && e.target.tagName) || ''; if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    armed = true; if (playing) stop(); else play();
  });
  // hear every render (the game calls render() on each state change); synchronous, so a
  // choice tap that changes the scene still counts as the gesture that starts the audio
  const gameRender = render;
  render = function(){ const r = gameRender.apply(this, arguments); try { onView(); } catch(e) {} return r; };
  viewKey = build().map(p => p.id).join(',');

  const withTimeout = (p, ms) => Promise.race([p, new Promise((_, no) => setTimeout(() => no(new Error('timeout')), ms))]);
  const v1 = fetch('audio/manifest.json', { cache: 'no-cache' }).then(r => r.ok ? r.json() : null).catch(() => null).then(m => {
    files = {};
    if (m && m.units) Object.keys(m.units).forEach(h => { files[h] = m.units[h].file; });
    api.files = Object.keys(files).length;
  });
  const arc = withTimeout(fetch(ARC + 'status', { cache: 'no-store' }), 6000).then(r => r.ok, () => false).then(ok => {
    api.arcStatus = ok; if (!ok) arcDownUntil = Date.now() + 60000;
  });
  Promise.all([v1, arc]).then(() => { if (api.arcStatus || api.files || hasTTS) { box.hidden = false; paint(); } });
})();
</script>
